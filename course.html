function lookup(raw){
  let k = raw.toLowerCase().replace(/[’']s$/,'').replace(/’/g,"'");
  const t = [k];
  if (k.endsWith('ies')) t.push(k.slice(0,-3)+'y');
  if (k.endsWith('ied')) t.push(k.slice(0,-3)+'y');
  if (k.endsWith('es'))  t.push(k.slice(0,-2));
  if (k.endsWith('s'))   t.push(k.slice(0,-1));
  if (k.endsWith('ed'))  { t.push(k.slice(0,-2)); t.push(k.slice(0,-1)); }
  if (k.endsWith('ing')) { t.push(k.slice(0,-3)); t.push(k.slice(0,-3)+'e'); }
  if (k.endsWith('ly'))  t.push(k.slice(0,-2));
  if (!lookup.all) { lookup.all = {}; LESSONS.forEach(l => { for (const w in (l.gloss||{})) if (!(w in lookup.all)) lookup.all[w] = l.gloss[w]; }); }
  const cur = UI.view === 'lesson' ? LESSONS.find(x => x.id === UI.id) : null, LG = (cur && cur.gloss) || {};
  for (const x of t) { const v = LG[x] || G[x] || lookup.all[x]; if (v) return { key:x, zh:v }; }
  return { key:k, zh:'' };
}

`<h3>🏗️ Foundation model 基礎模型</h3>

<p class="tiny">Gemini、Gemma、Imagen、Veo——這些等一下要認的模型，全部都是 Google 的 foundation model。</p>`,

`<h3>🎭 Multimodal 多模態</h3>

/*L3*/{ id: 3, title: '模型的毛病與解法（幻覺、RAG、Grounding）', ch: 'Ch3 · 20%', ready: true,
  mind: '這課只考一件事：<b>先認出模型出了什麼毛病，再對應該用什麼解</b>。編故事講得很篤定 → hallucination；資料太舊追不上時事 → knowledge cutoff；訓練資料本身比例失衡 → data dependency；讀不懂語氣細膩的話 → human-in-the-loop。解法大多繞著同一招：<b>給模型一份可以查的真實資料</b>，那就是 grounding、RAG、Agent Search 在做的事。',
  cards: [
`<h3>👻 Hallucination 幻覺</h3>
<p class="big">模型<b>憑空編故事</b>，還講得跟真的一樣，完全不會說「我不確定」。</p>
<p>🎨 畫面：一個很會掰的朋友被問路，編了一條根本不存在的捷徑，講得斬釘截鐵。</p>
<div class="kw"><span class="k en-t">made-up</span><span class="k en-t">confidently states</span><span class="k en-t">presents this information as factual</span><span class="k en-t">entirely fictional</span></div>
<div class="ex"><span class="en-t">The model <mark>confidently states</mark> a fact that is <mark>entirely fictional</mark> and presents it as factual.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">關鍵不是「講錯」，是「<b>編出根本不存在的東西，還講得很有把握</b>」。</p>`,

`<h3>📅 Knowledge cutoff 知識截止</h3>
<p class="big">模型的訓練資料有個<b>截止日</b>，那天之後發生的事，它完全不知道。</p>
<p>🎨 畫面：一本百科全書，印好那天之後發生的事，書裡永遠查不到。</p>
<div class="kw"><span class="k en-t">knowledge cutoff</span><span class="k en-t">recently updated product information</span><span class="k en-t">not present in the original training data</span></div>
<div class="ex"><span class="en-t">The model cannot answer questions about information <mark>not present in the original training data</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">跟幻覺不同：knowledge cutoff 是「誠實地不知道」；如果它不知道還硬掰，那個「掰」的動作才叫幻覺。</p>`,

`<h3>⚖️ Data dependency 資料依賴</h3>
<p class="big">訓練資料本身<b>比例失衡</b>或<b>過時</b>，模型學出來的判斷就跟著偏頗（<span class="en-t">bias</span> 偏誤）。</p>
<p>🎨 畫面：只給你看某一群人的意見當成「全部人的意見」，你的判斷當然會歪。</p>
<div class="kw"><span class="k en-t">disproportionately</span><span class="k en-t">outdated language norms</span><span class="k en-t">underrepresented</span><span class="k en-t">bias</span></div>
<div class="ex"><span class="en-t">The training dataset <mark>disproportionately</mark> includes feedback from one demographic.</span><button class="speak">🔊</button></div>
<div class="box warn">⚠️ 跟 <span class="en-t">Bias</span>（偏誤）很像，官方把它們列成兩種不同的限制。分法看題目<b>強調什麼</b>：強調資料<b>不夠、太舊、涵蓋不全、有錯</b>，所以輸出<b>不準</b> → <b>Data dependency</b>；強調結果對某一群人<b>不公平</b> → <b>Bias</b>。（考古題 NO.35 選項裡沒有 Bias，所以答 Data dependency。）</div>`,

`<h3>🧑‍⚖️ Human-in-the-loop（HITL）人工介入</h3>
<p class="big">模型讀不懂<b>諷刺、反諷、語氣細膩</b>的東西時，加一道<b>真人審查</b>把關。</p>
<p>🎨 畫面：AI 先寫初稿，主編看過才發布——有些「弦外之音」還是要靠人眼判斷。</p>
<div class="kw"><span class="k en-t">sarcasm</span><span class="k en-t">satire</span><span class="k en-t">nuanced opinions</span><span class="k en-t">human-in-the-loop</span><span class="k en-t">review process</span></div>
<div class="ex"><span class="en-t">The model occasionally misinterprets <mark>sarcasm</mark>, so the team adds a <mark>human-in-the-loop</mark> review.</span><button class="speak">🔊</button></div>
<p class="tiny">這題常見誘餌：拉高 temperature、改輸出長度、加安全設定，都跟「看不懂語氣」無關，別上當。</p>`,

`<h3>⚓ Grounding 接地（含 Grounding with Google Search）</h3>
<p class="big"><b class="en-t">Grounding</b>：把模型的回答<b>綁在真實、有出處的資料上</b>，不准憑空亂編。<span class="en-t">Grounding with Google Search</span> 是它的一種做法：資料<b>在公開網路上</b>（新聞、公開資訊）時，讓模型抓 Google 搜尋的即時結果來接地。</p>
<p>🎨 畫面：考試不准憑記憶答題，<b>翻開公開資料查到出處再回答</b>——答案有出處可查，就是接地了。</p>
<div class="kw"><span class="k en-t">grounding</span><span class="k en-t">source articles</span><span class="k en-t">official documentation</span><span class="k en-t">Grounding with Google Search</span></div>
<div class="ex"><span class="en-t">Use <mark>grounding</mark> to base the model output on the <mark>source articles</mark>.</span><button class="speak">🔊</button></div>
<div class="box warn">⚠️ 資料在<b>公開網路</b>（即時新聞、公開資訊）→ <span class="en-t">Grounding with Google Search</span>。資料是<b>公司自己的文件</b>（內部政策、產品手冊）→ 用 RAG／Agent Search，不是 Google Search。</div>`,

`<h3>📚 RAG（retrieval-augmented generation，檢索增強生成）＋ Agent Search（舊名 Vertex AI Search）</h3>
<p class="big"><b class="en-t">RAG</b>：模型回答前<b>先去外部資料庫抓最新、相關的資料</b>，再拿這些資料生成答案——是實現 grounding 最常見的做法，適合拿<b>公司自有文件</b>當依據。<b class="en-t">Agent Search</b>（舊名 <span class="en-t">Vertex AI Search</span>）：Google Cloud 的企業搜尋產品，讓公司把自己的文件（政策、產品手冊、目錄）變成知識庫，官方稱它提供 <span class="en-t">pre-built RAG</span>（預先搭好的 RAG），不用自己從零搭檢索管線。</p>
<p>🎨 畫面：RAG 是「先翻書找到那一頁再回答」的動作；Agent Search 則是公司自己的 Google 搜尋——查的不是全世界的網頁，是<b>自家倉庫裡的文件</b>。</p>
<div class="kw"><span class="k en-t">retrieval-augmented generation</span><span class="k en-t">retrieve relevant and up-to-date information</span><span class="k en-t">first-party data</span><span class="k en-t">knowledge graph</span></div>
<div class="ex"><span class="en-t">RAG enables the model to <mark>retrieve relevant and up-to-date information</mark> from <mark>official documentation</mark>.</span><button class="speak">🔊</button></div>
<div class="box warn">⚠️ 考古題選項裡常寫舊名 <span class="en-t">Vertex AI Search</span>——看到它，就當作是現在的 <b>Agent Search</b>，意思一樣。</div>`,

`<h3>🗺️ 毛病 → 解法對照表</h3>
<div class="tw"><table>
<tr><th>毛病</th><th>特徵</th><th>解法</th></tr>
<tr><td class="en-t">Hallucination</td><td>編造事實還講得篤定</td><td class="en-t">Grounding / RAG（給它東西可以查）</td></tr>
<tr><td class="en-t">Knowledge cutoff</td><td>訓練資料太舊，問最新的事答不出來</td><td class="en-t">RAG（抓外部最新資料）</td></tr>
<tr><td>讀不懂諷刺、語氣細膩</td><td>不是資料問題，是判斷力問題</td><td class="en-t">Human-in-the-loop（加真人審查）</td></tr>
<tr><td class="en-t">Data dependency / Bias</td><td>訓練資料本身比例失衡、過時</td><td>換／補齊訓練資料——<b>不是</b>靠 grounding 或 RAG 能解的</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>編故事查資料、太舊也查資料、看不懂語氣找人來、資料本身歪了只能換資料。</b></div>`,

`<h3>🪤 這課的陷阱總整理</h3>
<div class="box warn"><b>誘餌 1：拉高 <span class="en-t">temperature</span></b><br>
temperature 控制的是輸出的<b>隨機性、創意程度</b>，跟「幻覺」「看不懂語氣」都無關。考題常把它放進選項騙你，拉高 temperature 通常只會讓幻覺<b>更嚴重</b>，不是解法。</div>
<div class="box warn"><b>誘餌 2：<span class="en-t">Data dependency</span> vs <span class="en-t">Bias</span></b><br>
看題目強調什麼：資料<b>不夠、太舊、不完整、有錯</b> → 輸出不準 → Data dependency；結果對某些人<b>不公平</b> → Bias。別一看到「training data」就反射選其中一個。</div>
<div class="box warn"><b>誘餌 3：<span class="en-t">Grounding with Google Search</span> vs <span class="en-t">RAG / Agent Search</span></b><br>
資料在<b>公開網路</b>（即時新聞）→ Grounding with Google Search。資料是<b>公司自己的文件</b>（政策、手冊）→ RAG／Agent Search。認資料放在哪裡，別看到「grounding」三個字就選 Google Search。</div>
<div class="box warn"><b>誘餌 4：舊名 <span class="en-t">Vertex AI Search</span></b><br>
題目和選項裡常出現舊名，看到就當它是 <b>Agent Search</b>，意思沒變。</div>

     why:{A:'temperature 控制輸出的隨機創意程度，跟資料新不新沒關係。',B:'RAG 在回答前即時去抓最新航班資料，正好解決知識截止的問題。',C:'拿去年的舊資料微調，還是查不到上週才改的班次，沒解決問題。',D:'安全設定是過濾有害內容，跟資料過時無關。'}},
    {stem:'A company fine-tuned a generative AI model on a small set of product descriptions that contained many errors and missing details. The model now often writes inaccurate product descriptions. Which model limitation best explains this?',
     opts:['Bias','Data dependency','Hallucination','Knowledge cutoff'], ans:'B',
     key:'contained many errors and missing details',
     why:{A:'Bias 是結果對某一群人不公平，題目沒有提到任何族群被不公平對待。',B:'訓練資料又少、又有錯、又缺細節 → 輸出品質被資料拖累 → data dependency。',C:'題目的重點是資料品質差造成不準，不是模型憑空編出不存在的東西。',D:'不是資料太舊、追不上新事件，是資料本身品質差。'}},
    {stem:"An enterprise wants its internal support chatbot to answer only from the company's official HR policy documents stored in Google Cloud, without needing to build a custom retrieval pipeline from scratch. Which Google Cloud solution best meets this requirement?",
     opts:['Grounding with Google Search','Agent Search','BigQuery ML','Vertex AI Natural Language API'], ans:'B',
     key:'without needing to build a custom retrieval pipeline from scratch',
     why:{A:'Grounding with Google Search 抓的是公開網路，不是公司自己存放的 HR 文件。',B:'Agent Search 提供 pre-built RAG，企業不用自己搭建檢索管線就能查自家文件。',C:'BigQuery ML 是資料倉儲上做機器學習，不是文件檢索工具。',D:'Natural Language API 做情感分析、實體擷取，不是文件檢索。'}},
    {stem:"A generative AI model that summarizes movie reviews sometimes misses sarcasm, causing a negative review to be summarized as positive. Increasing the model's temperature made the outputs even less predictable and did not fix the problem. What should the team do instead?",
     opts:['Lower the temperature further','Add a human-in-the-loop review step for ambiguous reviews','Implement grounding with the original review text','Apply stricter safety settings'], ans:'B',
     key:'misses sarcasm',
     why:{A:'⚠️ 雙陷阱：temperature 控制的是輸出隨機性，不管調高調低都跟「聽不懂語氣」無關。',B:'諷刺、語氣細膩是機器判斷不了的灰色地帶，加真人審查才是標準解法。',C:'grounding 解決的是「憑空編造事實」，反諷內容本來就在原文裡，模型還是可能讀錯語氣，grounding 幫不上忙。',D:'安全設定是過濾有害內容，跟語氣判讀無關。'}}
  ],
  exam: [
    {no:48, stem:`A user asks a generative AI model about the scientific accuracy of a popular science fiction movie. The model confidently states that humans can indeed travel faster than light, referencing specific but entirely fictional theories and providing made-up explanations of how this is achieved according to the movie's "established science." The model presents this information as factual, without indicating that it originates from a fictional work. What type of model limitation is this?`,
     opts:['Bias','Knowledge cutoff','Data dependency','Hallucination'],
     ans:'D', keys:['confidently states','entirely fictional theories','made-up explanations'],
     why:{A:'題目沒有提到對特定群體或立場的系統性偏頗，是憑空捏造內容。',B:'知識截止是老實說不知道，不是編出一套「電影裡的科學」還講得很篤定。',C:'沒有訓練資料比例失衡的跡象，這是編造內容的問題。',D:'confidently states ＋ entirely fictional theories ＋ made-up explanations，還當作真的事實講 → 幻覺。'}},
    {no:35, stem:"A company trains a generative AI model designed to classify customer feedback as positive, negative, or neutral. However, the training dataset disproportionately includes feedback from a specific demographic and uses outdated language norms that don't reflect current customer communication styles. When the model is deployed, it shows a strong bias in its sentiment analysis for new customer feedback, misclassifying reviews from underrepresented demographics and struggling to understand current slang or phrasing. What type of model limitation is this?",
     opts:['Data dependency','Edge case','Hallucination','Overfitting'],
     ans:'A', keys:['training dataset disproportionately includes feedback from a specific demographic'],
     why:{A:'訓練資料集比例失衡、用詞過時，這是根因 → data dependency（題目講的 bias 是這個根因造成的結果，選項裡也沒有 Bias 這個選項）。',B:'edge case 指的是少見的特殊情境，題目描述的是系統性、持續發生的問題，不是偶發個案。',C:'沒有憑空編造事實，是對特定群體判斷失準。',D:'overfitting 是模型過度貼合訓練資料本身的雜訊、犧牲了對新資料的泛化能力，題目講的是訓練資料組成本身失衡，根因在資料而不是模型過度擬合的技術問題。'}},
    {no:63, stem:'A social media platform uses a generative AI model to automatically generate summaries of user-submitted posts to provide quick overviews for other users. While the summaries are generally accurate for factual posts, the model occasionally misinterprets sarcasm, satire, or nuanced opinions, leading to summaries that misrepresent the original intent and potentially cause misunderstandings or offense among users. What should the platform do to overcome this limitation of the AI-generated summaries?',
     opts:['Implement stricter safety settings to filter out potentially misinterpreted content altogether.','Increase the temperature parameter of the model to encourage more varied and less literal interpretations.','Decrease the output length of the summaries to make them more concise.','Incorporate a human-in-the-loop (HITL) review process to refine the summaries.'],
     ans:'D', keys:['misinterprets sarcasm, satire, or nuanced opinions'],
     why:{A:'把可能被誤讀的內容整個濾掉，不是修正誤讀，只是隱藏問題。',B:'拉高 temperature 增加輸出的隨機性，不會讓模型更看得懂語氣，反而可能更不穩定。',C:'縮短摘要長度跟讀不懂諷刺沒有關係。',D:'諷刺、反諷、語氣細膩本來就是機器判斷不了的灰色地帶，加真人審查才是標準解法。'}},
    {no:9, stem:"A company is developing a generative AI-powered customer support chatbot. They want to ensure the chatbot can answer a wide range of customer questions accurately, even those related to recently updated product information not present in the model's original training data. What is a key benefit of implementing retrieval-augmented generation (RAG) in this chatbot?",
     opts:['RAG will significantly reduce the computational resources required to run the generative AI model.','RAG will primarily help the chatbot generate more creative and engaging conversational responses.','RAG will enable the chatbot to fine-tune its underlying language model on the fly based on customer interactions.','RAG will enable the chatbot to access and utilize external, up-to-date knowledge sources to provide more accurate and relevant answers.'],
     ans:'D', keys:["not present in the model's original training data",'access and utilize external, up-to-date knowledge sources'],
     why:{A:'RAG 多了一道檢索的步驟，通常不會減少運算資源，這不是它的價值所在。',B:'RAG 的重點是準確度、不是讓回答更有創意。',C:'RAG 是查資料，不是即時微調模型本身的參數。',D:'資訊不在原始訓練資料裡 → RAG 讓它能存取外部最新知識來源，給出更準確的答案。'}},
    {no:52, stem:"A company's large learning model (LLM) is producing hallucinations that are a result of the Knowledge cutoff. How does retrieval-augmented generation (RAG) overcome this limitation?",
     opts:['RAG fine-tunes the LLM on specific customer query patterns to improve the speed and efficiency of response generation.','RAG enhances the creative writing capabilities of the LLM to generate more engaging and informative responses.','RAG enables the LLM to retrieve relevant and up-to-date information from knowledge sources.','RAG uses human oversight to ensure accuracy before presenting information to the customer.'],
     ans:'C', keys:['Knowledge cutoff','retrieve relevant and up-to-date information'],
     why:{A:'RAG 不會即時微調模型參數，它是在回答前去查資料。',B:'跟提升創意寫作能力無關，重點是資料新不新、準不準。',C:'RAG 讓模型能從知識來源取得相關且最新的資訊，正好補上 knowledge cutoff 的缺口。',D:'人工審查是 human-in-the-loop 的做法，不是 RAG 的機制。'}},
    {no:10, stem:'A development team is building an internal knowledge base chatbot to answer employee questions about company policies and procedures. This information is stored across various documents in Google Cloud Storage and is updated regularly by different departments. What is the primary benefit of using Google Cloud\'s RAG APIs in this scenario?',
     opts:['They provide a pre-built user interface for the chatbot, simplifying the front-end development process.','They allow the development team to train a single foundation model on all company documents.','They enable the generative AI model to retrieve the most up-to-date and relevant information from the policy documents in real-time.','They automatically create summaries of all company policies, which are then presented to employees as quick answers.'],
     ans:'C', keys:['updated regularly','retrieve the most up-to-date and relevant information'],
     why:{A:'RAG APIs 的價值不是提供前端介面，是資料檢索。',B:'RAG 不是把所有文件拿去訓練成單一模型，是查詢時即時檢索。',C:'政策文件常常更新，RAG 讓模型能即時取得最新且相關的資訊來回答。',D:'RAG 不是自動幫每份政策寫摘要，是在被問到時去查相關內容。'}},
    {no:2, stem:'A large e-commerce company with a vast and frequently updated product catalog finds that customers struggle to find products on their website, and support agents spend too much time finding detailed product information. The company wants to improve search accuracy and efficiency for both customers and support. What Google Cloud solution should they use?',
     opts:['Vertex AI Conversation','Vertex AI Natural Language API','Pre-built RAG with Vertex AI Search','Vertex AI Model Garden'],
     ans:'C', keys:['frequently updated product catalog','search accuracy'],
     why:{A:'Vertex AI Conversation（現行名 Agent Conversation）是建對話式 AI 的能力，不是搜尋產品，跟這題要解的「搜尋準確度」問題不對應。',B:'Natural Language API 做情感分析、實體擷取，不是拿來做商品搜尋的。',C:'目錄頻繁更新 ＋ 要提升搜尋準確度 → Pre-built RAG with Vertex AI Search，考場現行名為 <b>Agent Search</b>，題幹選項照抄舊名。',D:'Model Garden 是挑選模型的市集，不是搜尋解決方案。'}},
    {no:34, stem:'A company wants to use generative AI to create a chatbot that can answer customer questions about their products and services. They need to ensure that the chatbot only uses information from the company\'s official documentation. What should the company do?',
     opts:['Use role prompting.','Adjust the temperature parameter.','Use prompt chaining.','Use grounding.'],
     ans:'D', keys:["only uses information from the company's official documentation"],
     why:{A:'role prompting 是設定語氣、人設，不會限制回答只能用官方文件。',B:'temperature 控制輸出的隨機創意程度，跟限制資料來源無關。',C:'prompt chaining 是把多個提示串起來做多步驟任務，不是限制資料來源。',D:'只准用官方文件回答 = 把輸出綁在真實來源上 → grounding。'}},
    {no:69, stem:'A company wants to use generative AI to create a chatbot that can answer customer questions about their products and services. They need to ensure that the chatbot only uses information from the company\'s official documentation. What should the company do?',
     opts:['Use role prompting.','Adjust the temperature parameter.','Use prompt chaining.','Use grounding.'],
     ans:'D', keys:["only uses information from the company's official documentation"],
     why:{A:'跟 NO.34 完全一樣的題目與選項，這題是重複題（送分題）——認內容，不要背字母順序。',B:'同上，temperature 跟限制資料來源無關。',C:'同上，prompt chaining 不是限制資料來源的做法。',D:'只准用官方文件回答 → grounding，跟 NO.34 答案一致。'}},
    {no:67, stem:"A global news company is using a large language model to automatically generate summaries of news articles for their website. The model's summary of an international summit was accurate until it hallucinated by stating a detail that did not occur. How should the company overcome this hallucination?",
     opts:['Implement stricter safety settings to filter out potentially controversial topics.','Fine-tune the model on a larger dataset of news articles.','Increase the temperature setting of the model to encourage more diverse outputs.','Use grounding to base the model output on the source articles.'],
     ans:'D', keys:['hallucinated by stating a detail that did not occur','source articles'],
     why:{A:'安全設定是過濾具爭議或有害的內容，不是修正憑空捏造的細節。',B:'在更大的資料集上微調，不保證摘要會緊貼這一篇原始文章的內容。',C:'拉高 temperature 只會讓輸出更隨機、更容易亂講，是幻覺問題的反效果。',D:'原始文章本來就是現成的來源文件，用 grounding 把輸出鎖在這些文章上，就不會再編出沒發生過的細節。'}},
    {no:29, stem:'A global news agency is developing a generative AI tool to quickly summarize breaking news articles as they emerge online. The goal is to provide their audience with rapid updates on fast-developing stories from various global sources. What Google Cloud solution should they use?',
     opts:['Document AI','BigQuery','Vertex AI Natural Language API','Grounding with Google Search'],
     ans:'D', keys:['breaking news articles as they emerge online'],
     why:{A:'Document AI 是從掃描文件、表單裡擷取結構化資料，不是抓即時網路新聞。',B:'BigQuery 是資料倉儲，不是即時網路資訊檢索工具。',C:'Natural Language API 做情感分析、實體擷取，不負責抓最新新聞。',D:'新聞是<b>公開網路上正在發生的事</b>，不是公司自己的文件，所以用 Grounding with Google Search，而不是 Agent Search（那個是查公司自有文件）。'}},
    {no:60, stem:'What does Vertex AI Search enable companies to do?',
     opts:['To index and retrieve information from the entire public web, providing a comprehensive view of publicly available data.','To surface the most popular and frequently accessed content based on global user search patterns and trends.','To compare products from numerous online retailers, allowing users to find the best deals and product options across the internet.','To ground LLM responses with first-party data, third-party data, and Google\'s knowledge graph.'],
     ans:'D', keys:["first-party data","Google's knowledge graph"],
     why:{A:'索引整個公開網路是一般 Google 搜尋在做的事，Vertex AI Search（現行名 Agent Search）的重點是企業自己的資料，不是整個公開網路。',B:'不是在比誰的內容最熱門，是幫企業用自己的資料把 LLM 接地。',C:'比價、比商品是購物比較服務在做的事，不是這個產品的定位。',D:'用第一方（公司自己的）、第三方資料幫 LLM 接地 → 這就是 Vertex AI Search（現行名 Agent Search）在做的事。📘 小提醒：「Google\'s knowledge graph」是這題考古題的舊講法，現行官方考試指南寫的是 <b>world data</b>（全世界的公開資料）——考場看到任一種說法都認得就好。'}}
  ],

/*L4*/{ id: 4, title: 'Prompt 技巧', ch: 'Ch3 · 20%', ready: true,
  mind: '這一課只考一件事：看題目<b>想要模型多做哪一件事</b>——不給範例？給範例？扮角色？拆步驟推理？接續對話？還是要它邊想邊動手查資料？六種情境對六招。',
  cards: [
`<h3>🎯 Zero-shot：完全不給範例，直接問</h3>
<p class="big">沒有提供任何範例，直接叫模型做，靠它自己內建的知識回答。</p>
<p>🎨 畫面：直接問路人「這條路怎麼走」，沒有先示範一次給他看。</p>
<div class="kw"><span class="k en-t">zero-shot</span><span class="k en-t">without any examples</span><span class="k en-t">directly</span></div>
<div class="ex"><span class="en-t">The prompt asks the model to translate a sentence <mark>without providing any examples</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>`,

`<h3>📚 One-shot／Few-shot：給範例照樣造句</h3>
<p class="big">在 prompt 裡放 1 個（<span class="en-t">one-shot</span>）或多個（<span class="en-t">few-shot</span>）範例，模型看範例學格式跟語氣。</p>
<p>🎨 畫面：教新人做事，先做一次（或幾次）給他看，他照著做。</p>
<div class="kw"><span class="k en-t">one-shot</span><span class="k en-t">few-shot</span><span class="k en-t">a single example</span><span class="k en-t">examples of</span></div>
<div class="ex"><span class="en-t">The prompt includes <mark>examples of</mark> good and bad customer service emails.</span><button class="speak">🔊</button></div>
<p class="tiny">有時候不會直接寫 few-shot 這個字，而是用 <span class="en-t">examples of successful interactions</span>（成功互動的範例）這種說法帶過——看有沒有給範例，不要只找關鍵字。</p>`,

`<h3>🎭 Role prompting：給模型一個身分</h3>
<p class="big">叫模型扮演某個角色（客服人員、老師、律師…），連帶決定語氣和用詞。</p>
<p>🎨 畫面：找人客串演一個角色，交代「你現在是客服，要有禮貌」。</p>
<div class="kw"><span class="k en-t">act as</span><span class="k en-t">adopt a tone</span><span class="k en-t">role prompting</span><span class="k en-t">appropriate for the target audience</span></div>
<div class="ex"><span class="en-t">The prompt instructs the model to <mark>act as</mark> an experienced customer service representative.</span><button class="speak">🔊</button></div>
<p class="tiny">題目講「<span class="en-t">tone</span>（語氣）」或「<span class="en-t">appropriate for the target audience</span>（貼合目標受眾）」，也常常是在講 role prompting，不一定會直接寫 role 這個字。</p>`,

`<h3>🧠 Chain-of-thought：叫模型一步一步想</h3>
<p class="big">要求模型把推理過程拆成一步一步講出來，不要直接跳到答案。</p>
<p>🎨 畫面：數學老師要你「寫出解題過程」，不是只寫答案。</p>
<div class="kw"><span class="k en-t">chain-of-thought</span><span class="k en-t">step by step</span><span class="k en-t">first</span><span class="k en-t">then</span><span class="k en-t">reasoning</span></div>
<div class="ex"><span class="en-t"><mark>First</mark>, identify the issue. <mark>Then</mark>, check the knowledge base.</span><button class="speak">🔊</button></div>
<p class="tiny">就算題目沒寫出 chain-of-thought 這個詞，只要 prompt 裡列了「<span class="en-t">first … then … if …</span>」這種一步接一步的指示，就是它。</p>
<p class="tiny">📘 官方學習指南的講法：chain-of-thought 也可以是「給範例，範例裡附上中間推理步驟」。所以看到「範例＋推理過程」一起出現，也是它（不是單純的 few-shot）。</p>`,

`<h3>🔗 Prompt chaining：一輪接一輪，串起來用</h3>
<p class="big">把上一輪的輸出接到下一輪的輸入，讓對話有「記憶」、多步驟串接完成。</p>
<p>🎨 畫面：接力賽跑，前一棒的成果直接交給下一棒繼續跑。</p>
<div class="kw"><span class="k en-t">prompt chaining</span><span class="k en-t">previous portions of the conversation</span><span class="k en-t">multiple steps</span></div>
<div class="ex"><span class="en-t">The chatbot needs to access <mark>previous portions of the conversation</mark> with the customer.</span><button class="speak">🔊</button></div>
<div class="box warn">⚠️ 別跟 chain-of-thought 搞混：<span class="en-t">chain-of-thought</span> 是「<b>一次</b>回答裡拆步驟推理」；<span class="en-t">prompt chaining</span> 是「<b>好幾輪</b>對話或好幾次呼叫接起來、有記憶」。</div>`,

`<h3>🤖 ReAct：邊想邊做，推理跟行動交替</h3>
<p class="big">模型不只是想（<span class="en-t">Reasoning</span>），還會採取行動（<span class="en-t">Acting</span>）——像是呼叫工具、查資料，然後根據結果繼續推理。</p>
<p>🎨 畫面：邊想邊做實驗：想一步、動手查一步、再想下一步。</p>
<div class="kw"><span class="k en-t">ReAct</span><span class="k en-t">reasoning and acting</span><span class="k en-t">call a tool</span><span class="k en-t">take an action</span></div>
<div class="ex"><span class="en-t">The agent <mark>reasons</mark> about the task, then <mark>calls a tool</mark> to check real information.</span><button class="speak">🔊</button></div>
<p class="tiny">ReAct 常出現在會呼叫外部工具或系統的 agent 題型裡，不是單純的一問一答。</p>`,

`<h3>🔑 六招一張表</h3>
<div class="tw"><table>
<tr><th>技巧</th><th>一句話</th><th>看到這些英文</th></tr>
<tr><td><b class="en-t">Zero-shot</b></td><td>不給範例，直接問</td><td class="en-t">without examples, directly</td></tr>
<tr><td><b class="en-t">One/Few-shot</b></td><td>給範例照樣造句</td><td class="en-t">example(s) of, successful interactions</td></tr>
<tr><td><b class="en-t">Role prompting</b></td><td>給角色、給語氣</td><td class="en-t">act as, tone, target audience</td></tr>
<tr><td><b class="en-t">Chain-of-thought</b></td><td>一步一步推理</td><td class="en-t">step by step, first, then, if</td></tr>
<tr><td><b class="en-t">Prompt chaining</b></td><td>多輪串接、有記憶</td><td class="en-t">previous conversation, multiple steps</td></tr>
<tr><td><b class="en-t">ReAct</b></td><td>推理＋行動交替</td><td class="en-t">reasoning and acting, call a tool</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>沒範例直接問、有範例照樣造、要人設就扮演、要推理就一步步、要記憶就串起來、要動手就邊想邊查。</b></div>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：沒寫 <span class="en-t">few-shot</span> 這個字，也可能是 few-shot</b><br>
題目只講「<span class="en-t">examples of successful interactions</span>」（成功互動的範例），沒有出現 few-shot 這個字——看<b>有沒有給範例</b>，不要只找關鍵字本身。</div>
<div class="box warn"><b>誘餌 2：Chain-of-thought vs Prompt chaining</b><br>
<span class="en-t">chain-of-thought</span> 是「一次回答內部拆步驟」；<span class="en-t">prompt chaining</span> 是「好幾輪對話或好幾次呼叫接起來、有記憶」——關鍵看是<b>一次</b>還是<b>好幾輪</b>。</div>
<div class="box warn"><b>誘餌 3：輸出空泛、沒重點</b><br>
模型輸出 <span class="en-t">generic</span>（空泛）、<span class="en-t">lackluster</span>（乏味）→ 第一步永遠是<b>把 prompt 寫更清楚</b>（補受眾、語氣、關鍵字），不是急著調模型參數或重新訓練模型。</div>
<div class="box warn"><b>誘餌 4：Prompt engineering vs Fine-tuning</b><br>
<span class="en-t">prompt engineering</span> 是「改你怎麼問」，不動模型本身；<span class="en-t">fine-tuning</span> 是「真的拿資料重新訓練模型」——題目要「快速調整、不改模型」時，答案在 prompt 這邊。</div>
<p>看完了 🎉 接下來換你動手：② 先練「看到英文片語 → 反射出是哪一招」。</p>`

    {no:49, stem:`A company is using a language model to solve complex customer service inquiries. For a particular issue, the prompt includes the following instructions: "To address this customer's problem, we should first identify the core issue they are experiencing. Then, we need to check if there are any known solutions or workarounds in our knowledge base. If a solution exists, we should clearly explain it to the customer. If not, we might need to escalate the issue to a specialist. Following these steps will help us provide a comprehensive and helpful response. Now, given the customer's message: 'My order hasn't arrived, and the tracking number shows no updates for a week,' what should be the next step in resolving this?" What type of prompting is this?`,

/*L5*/{ id: 5, title: '模型參數（Temperature、Top-p…）', ch: 'Ch3 · 20%', ready: true,
  mind: '這一課只考一件事：看題目要<b>穩定一致</b>還是<b>有創意多樣</b>、要<b>多長</b>、要不要<b>擋有害內容</b>——四個問法對應四個參數，對號入座就好。',
  cards: [
`<h3>🧩 Token：模型「數」文字的單位</h3>
<p class="big">模型不是照「字」算的，是照 <span class="en-t">token</span>（模型處理文字的最小單位，大概是一個字或半個英文字）在算。</p>
<p>🎨 畫面：把一句話剪成一小段一小段的積木，模型一次讀一小塊積木。</p>
<div class="kw"><span class="k en-t">token</span><span class="k en-t">tokens</span></div>
<div class="ex"><span class="en-t">The model processes text as a sequence of <mark>tokens</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">接下來每個參數，其實都是在調整模型怎麼挑 token、挑幾個 token。</p>`,

`<h3>🌡️ Temperature：穩定 vs 有創意</h3>
<p class="big"><span class="en-t">Temperature</span> 控制輸出的<b>隨機程度</b>：調低 → 答案穩定可預測；調高 → 答案有創意、每次不太一樣。</p>
<p>🎨 畫面：溫度調低，人冷靜照規矩來；溫度調高，人放飛自我亂發揮。</p>
<div class="kw"><span class="k en-t">temperature</span><span class="k en-t">randomness</span><span class="k en-t">predictable</span><span class="k en-t">creative</span><span class="k en-t">varied</span></div>
<div class="ex"><span class="en-t">Lowering the <mark>temperature</mark> makes the output more <mark>consistent and predictable</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">要「每次都一樣、講標準答案」→ 調低；要「每次都不一樣、有驚喜」→ 調高。</p>`,

`<h3>🎯 Top-p：從機率累積到 p 的候選字裡挑</h3>
<p class="big"><span class="en-t">Top-p</span>（<span class="en-t">nucleus sampling</span>）：模型只從機率<b>累加到 p</b> 的那一小群候選字裡挑下一個字，不是每個字都考慮。</p>
<p>🎨 畫面：點餐只看菜單上最常被點的那幾道菜，不會把整本菜單通通考慮一遍。</p>
<div class="kw"><span class="k en-t">top-p</span><span class="k en-t">nucleus sampling</span><span class="k en-t">cumulative probability</span><span class="k en-t">smallest set</span></div>
<div class="ex"><span class="en-t">The model samples from the <mark>smallest set</mark> of tokens whose <mark>cumulative probability</mark> reaches the top-p value.</span><button class="speak">🔊</button></div>
<p class="tiny">跟 temperature 很像都在管多樣性，但 top-p 是用機率門檻挑候選字，temperature 是調整挑字時的隨機程度——兩個常一起出現，也常被拿來互相當誘餌。</p>`,

`<h3>📏 Output length：輸出長度上限</h3>
<p class="big"><span class="en-t">Output length</span>（也叫 <span class="en-t">max output tokens</span>）：設定這次最多能生成幾個 token，直接決定回答可以多長。</p>
<p>🎨 畫面：一個裝水的杯子，杯子多大就決定最多能裝多少水——跟水好不好喝（有沒有創意）無關。</p>
<div class="kw"><span class="k en-t">output length</span><span class="k en-t">max output tokens</span><span class="k en-t">concise</span></div>
<div class="ex"><span class="en-t">The team sets a low <mark>max output tokens</mark> value so every summary stays short and <mark>concise</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「簡短、字數限制、不要超過幾個字」→ 只找 output length，不要去調 temperature。</p>`,

`<h3>🛡️ Safety settings：擋有害內容的門檻</h3>
<p class="big"><span class="en-t">Safety settings</span>：依設定的過濾等級，擋掉有害或不適當的輸出內容。</p>
<p>🎨 畫面：門口的保全，依規定門檻擋掉不該進來的人。</p>
<div class="kw"><span class="k en-t">safety settings</span><span class="k en-t">filter</span><span class="k en-t">harmful</span><span class="k en-t">inappropriate</span></div>
<div class="ex"><span class="en-t">Safety settings <mark>filter out</mark> potentially <mark>harmful or inappropriate</mark> content.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「有害內容、不當內容、要不要擋」→ 只找 safety settings，跟長度、創意、機率都無關。</p>`,

`<h3>🔑 四個參數一張表</h3>
<div class="tw"><table>
<tr><th>參數</th><th>管什麼</th><th>看到這些英文</th></tr>
<tr><td><b class="en-t">Temperature</b></td><td>穩定 vs 有創意（隨機程度）</td><td class="en-t">randomness, predictable, creative, varied</td></tr>
<tr><td><b class="en-t">Top-p</b></td><td>從累積機率到 p 的候選字挑（多樣性）</td><td class="en-t">nucleus sampling, cumulative probability</td></tr>
<tr><td><b class="en-t">Output length</b></td><td>輸出長度上限</td><td class="en-t">max output tokens, concise</td></tr>

/*L7*/{ id: 7, title: 'Agent Platform 零件＋改名陷阱', ch: 'Ch2 · 35%', ready: true,
  mind: 'Agent Platform 是一整座<b>工廠</b>，題目都在問「工廠裡哪一個部門」：挑模型找 Model Garden、正式試 prompt 找 Agent Studio、隨手試玩找 Google AI Studio、存版本找 Model Registry、做企業搜尋找 Agent Search。認對部門，答案就出來了——而且題庫原文常常還寫著舊名，考場已經換新名，兩邊都要認得。',
  cards:[
`<h3>🏭 Agent Platform（舊名 Vertex AI／Vertex AI Platform）</h3>
<p class="big">Google Cloud 的<b>統一 ML／生成式 AI 平台</b>——建立、訓練、調整、部署模型跟 AI 代理，整套端到端都在這裡完成。</p>
<p>🎨 畫面：一整座<b>大工廠</b>，裡面每個部門各司其職（挑模型的市集、試做的工作台、存檔案的登記處、對外的搜尋部門），Agent Platform 就是那座廠房本身。</p>
<div class="kw"><span class="k en-t">unified platform</span><span class="k en-t">infrastructure, tools, and pre-trained models</span><span class="k en-t">build, deploy, and manage</span></div>
<div class="ex"><span class="en-t">Agent Platform provides the <mark>infrastructure, tools, and pre-trained models</mark> you need to <mark>build, deploy, and manage</mark> your generative AI solutions.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">舊名 <span class="en-t">Vertex AI</span>／<span class="en-t">Vertex AI Platform</span>，2026 年改名。題庫原文還是寫舊名，考場請認新名 <b class="en-t">Agent Platform</b>（全名 Gemini Enterprise Agent Platform）。</p>`,

`<h3>🌱 Model Garden</h3>
<p class="big">工廠裡的<b>選模型市集</b>——探索、挑選、客製 Google 跟合作夥伴、開源社群現成的模型。</p>
<p>🎨 畫面：走進一座<b>種苗場</b>，架上擺滿各家現成的模型幼苗，你直接挑一株帶走，不用自己從種子開始種。</p>
<div class="kw"><span class="k en-t">Model Garden</span><span class="k en-t">discover, customize, and deploy</span><span class="k en-t">existing models</span><span class="k en-t">Google, third-party, or open-source</span></div>
<div class="ex"><span class="en-t">Model Garden lets you <mark>discover, customize, and deploy existing models</mark> from Google, third-party, or open-source providers.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">照改名規律走：主體名字沒變，只是掛到 Agent Platform 底下——考場看到 <span class="en-t">Model Garden</span> 四個字就對了，不用改口。</p>`,

`<h3>🎛️ Agent Studio vs. Google AI Studio</h3>
<p class="big">兩個都能試 prompt、調 Gemini 模型參數，差在<b>正不正式</b>。</p>
<p>🎨 畫面：Google AI Studio 像<b>路邊隨手畫草稿的畫板</b>，免費、開了就能用；Agent Studio 像<b>正式的生產線工作台</b>，要接企業規模、要上線部署。</p>

/*L8*/{ id: 8, title: '客服四件套＋其他產品', ch: 'Ch2 · 35%', ready: true,
  mind: '客服題先分清楚四種角色：整套基礎建設（CCaaS）／即時幫真人（<b>Agent Assist</b>）／自動聊天機器人（<b>Conversational Agents</b>）／事後分析對話（<b>Conversational Insights</b>）。其他產品題看<b>要處理的東西是什麼</b>——文件要附出處找 Gemini Notebook、掃描件抽欄位找 Document AI、做影片找 Google Vids——對號入座就對了。',
  cards: [
`<h3>🏢 CCaaS：整套客服中心的地基</h3>
<p class="big">全名 <span class="en-t">Contact Center as a Service</span>——雲端原生的<b>整套客服中心基礎建設</b>，多管道（電話、聊天、Email）整合、自動分派、串接 CRM 系統，其他客服工具都是蓋在它上面。</p>
<p>🎨 畫面：整棟客服大樓的<b>地基和水電管線</b>——先有這個，才能在上面裝真人客服、聊天機器人、分析儀表板。</p>
<div class="kw"><span class="k en-t">CCaaS</span><span class="k en-t">Contact Center as a Service</span><span class="k en-t">omnichannel support</span><span class="k en-t">infrastructure</span><span class="k en-t">routing</span></div>
<div class="ex"><span class="en-t">CCaaS provides the <mark>infrastructure</mark> for an enterprise-grade contact center with <mark>omnichannel support</mark>, routing, and CRM integration.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">題目只講「公司被多管道客服訊息淹沒，要一套完整解決方案」，沒有特別指名要即時協助、自動聊天或分析，通常就是要整套地基 CCaaS。</p>`,

`<h3>🎧 Agent Assist：站在真人客服背後偷偷提示</h3>
<p class="big">在真人客服<b>正在對話的當下</b>，即時給建議回覆、相關資訊，幫他更快更準確地回答，不是自動化取代他。</p>
<p>🎨 畫面：客服耳朵裡有個<b>隱形教練</b>，客人一開口，教練馬上在螢幕上打字提醒「這句話該這樣回」。</p>
<div class="kw"><span class="k en-t">Agent Assist</span><span class="k en-t">real-time</span><span class="k en-t">recommended responses</span><span class="k en-t">live customer service agents</span></div>
<div class="ex"><span class="en-t">Agent Assist provides <mark>real-time</mark> assistance and <mark>recommended responses</mark> to live agents during their interactions.</span><button class="speak" title="唸給我聽">🔊</button></div>
<div class="box warn">⚠️ Agent Assist 是幫<b>真人</b>客服，不是取代真人、也不是全自動——題目講 <span class="en-t">without fully automating</span>（不想全自動化）或 <span class="en-t">guidance to agents</span>（給客服建議）就是它。</div>`,

`<h3>🤖 Conversational Agents：自己上場聊天的機器人</h3>
<p class="big">拿來<b>建置、部署</b>會自動對話的聊天機器人／代理，不需要真人接手，直接跟客戶對話完成任務。</p>
<p>🎨 畫面：客服櫃檯前<b>一台自動應答機</b>，客人打字問問題，機器人自己回答，真人不用出面。</p>
<div class="kw"><span class="k en-t">Conversational Agents</span><span class="k en-t">build and deploy</span><span class="k en-t">chatbot agents</span><span class="k en-t">automated customer support</span></div>
<div class="ex"><span class="en-t">Conversational Agents let a team <mark>build and deploy</mark> generative <mark>chatbot agents</mark> for <mark>automated customer support</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">⚠️ 現行改名：exam guide 考題還是寫 <b class="en-t">Conversational Agents</b>，但官方產品頁已經改叫 <b class="en-t">Customer Experience Agent Studio</b>——兩個名字都要認得，考場出現哪個都不奇怪。</p>`,

`<h3>📊 Conversational Insights：事後把對話拿來分析</h3>
<p class="big">分析<b>已經發生過的</b>客服對話資料（不管是真人聊的還是機器人聊的），抓出客戶情緒、常見話題、客服表現的洞察。</p>
<p>🎨 畫面：客服結束後，有人把<b>所有通話錄音和對話紀錄</b>拿去做報表，畫出「客人最常抱怨什麼」的圖表。</p>
<div class="kw"><span class="k en-t">Conversational Insights</span><span class="k en-t">analyze conversational data</span><span class="k en-t">sentiment</span><span class="k en-t">agent performance</span></div>
<div class="ex"><span class="en-t">Conversational Insights can <mark>analyze conversational data</mark> to identify customer <mark>sentiment</mark> and <mark>agent performance</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">⚠️ 現行改名：exam guide 考題還是寫 <b class="en-t">Conversational Insights</b>，官方產品頁已經改叫 <b class="en-t">Customer Experience Insights</b>——兩個名字都要認得。</p>`,

`<h3>🔑 客服四件套一次分清楚</h3>
<div class="tw"><table>

`<h3>📓 Gemini Notebook（舊名 NotebookLM）：附出處的研究助理</h3>
<p class="big">把自己的文件<b>上傳</b>進去，它只根據<b>你給的來源</b>回答問題、做摘要，而且每個答案都<b>附引用出處</b>，不會亂編。</p>
<p>🎨 畫面：一個<b>只讀你指定的那疊資料</b>的研究助理，你問他問題，他翻到第幾頁指給你看，不會自己腦補。</p>
<div class="kw"><span class="k en-t">Gemini Notebook</span><span class="k en-t">NotebookLM</span><span class="k en-t">upload</span><span class="k en-t">citations</span><span class="k en-t">source material</span></div>
<div class="ex"><span class="en-t">Gemini Notebook lets you <mark>upload</mark> documents and get summarized insights directly from the <mark>source material</mark> with <mark>citations</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">考古題原題還是寫 <b class="en-t">NotebookLM</b>，官方現行名叫 <b class="en-t">Gemini Notebook</b>——同一個產品，題目認舊名就好，你自己說話用新名。</p>`,

`<h3>📄 Document AI：把掃描文件變成整齊欄位</h3>
<p class="big">丟進<b>掃描件、各種格式的 PDF</b>（表單、發票、申請書），它自動<b>抽出欄位</b>（姓名、金額、日期…），不用人工一個個打進系統。</p>
<p>🎨 畫面：一台<b>超強掃描機</b>，紙本丟進去，另一頭直接吐出整理好的欄位資料。</p>
<div class="kw"><span class="k en-t">Document AI</span><span class="k en-t">scanned documents</span><span class="k en-t">varying layouts</span><span class="k en-t">extract</span></div>
<div class="ex"><span class="en-t">Document AI can <mark>extract</mark> key information from <mark>scanned documents</mark> with <mark>varying layouts</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>

<p>🎨 畫面：<b>免費的影片剪輯軟體</b>加自動配音，自己拖一拖就生出一支介紹影片。</p>
<div class="kw"><span class="k en-t">Google Vids</span><span class="k en-t">training video</span><span class="k en-t">avatar</span><span class="k en-t">voiceover</span></div>
<div class="ex"><span class="en-t">The team used <mark>Google Vids</mark> to create a training video with a custom <mark>avatar</mark> and <mark>voiceover</mark>, without spending any money.</span><button class="speak" title="唸給我聽">🔊</button></div>`,

    {stem:'A retail brand wants to launch a fully automated chatbot that can independently answer common shipping and return questions around the clock without any human intervention. What should they build?',

    {stem:'A customer experience manager wants to review thousands of past chat and call transcripts to identify recurring complaints and measure how well each agent is performing. Which product should they use?',

    {stem:'A legal team has hundreds of scanned contracts with inconsistent layouts and needs to automatically pull out fields like party names, dates, and amounts into a spreadsheet. Which tool should they use?',

  exam: [
    {no:4, stem:'A national bank is overwhelmed by customer inquiries across multiple channels and needs an AI-powered solution to provide seamless, consistent support, empower customer support agents, and improve service quality. What Google Cloud product should the bank use?',
     opts:['Vertex AI Search','Gemini for Google Workspace','Google Contact Center as a Service','Gemini for Google Cloud'],
     ans:'C', keys:['customer inquiries across multiple channels','Contact Center as a Service'],
     why:{A:'Vertex AI Search 是企業內外部資料搜尋／推薦，跟處理多管道客服流量、賦能客服人員無關。',B:'Gemini for Google Workspace 是把生成式 AI 嵌進 Gmail、Docs 等 Workspace 應用，不是客服中心的解決方案。',C:'seamless, consistent support 跨 multiple channels ＋ empower customer support agents ＋ improve service quality = 整套多管道客服中心基礎建設 → Contact Center as a Service（CCaaS）。',D:'Gemini for Google Cloud 是協助開發、除錯、分析 BigQuery 的雲端 AI 助理，不是客服中心解決方案。'}},
    {no:12, stem:`What will Google Cloud's Agent Assist help a company achieve?`,
     opts:['The infrastructure to provide an enterprise-grade contact center solution with omnichannel support, routing, and integration with CRM systems.','The ability to analyze conversational data to identify customer sentiment, common topics of discussion, and insights into agent performance and customer experience.','The ability to provide real-time assistance and recommended responses to live customer service agents during their interactions.','The ability to build and deploy deterministic and generative chatbot agents for automated customer support.'],
     ans:'C', keys:['real-time assistance and recommended responses'],
     why:{A:'A 描述的是 CCaaS（整套基礎建設、omnichannel、CRM 整合），不是 Agent Assist 的功能。',B:'B 描述的是 Conversational Insights（分析對話資料、找出情緒與洞察），不是 Agent Assist。',C:'real-time assistance and recommended responses to live customer service agents = Agent Assist 的招牌定義。',D:'D 描述的是 Conversational Agents（建置部署聊天機器人做自動化客服），不是 Agent Assist。'}},
    {no:46, stem:`An organization with a team of live customer service agents wants to improve agent efficiency and customer satisfaction during support interactions. They are looking for a tool that can provide real-time guidance to agents, suggest helpful information, and streamline the support process without fully automating customer conversations. Which component of Google's Customer Engagement Suite should they use?`,
     opts:['Agent Assist','Conversational Agents','Conversational Insights','Google Cloud Contact Center as a Service'],
     ans:'A', keys:['real-time guidance to agents','without fully automating customer conversations'],
     why:{A:'real-time guidance to agents ＋ without fully automating = 即時協助真人、不取代 → Agent Assist。',B:'Conversational Agents 是完全自動化的聊天機器人，題目明講不想全自動。',C:'Conversational Insights 是事後分析對話資料，不是即時給真人客服建議。',D:'CCaaS 是整套基礎建設，不是針對「即時給真人客服建議」這個需求的工具。'}},
    {no:54, stem:`An organization wants to understand trends in customer interactions, identify common issues, gauge customer sentiment, and improve the overall customer experience across both their automated chatbot interactions and live agent support. They need a tool that can analyze their existing conversational data to gain actionable business intelligence. What component of Google's Customer Engagement Suite best addresses this need?`,
     opts:['Google Cloud Contact Center as a Service','Agent Assist','Conversational Agents','Conversational Insights'],
     ans:'D', keys:['analyze their existing conversational data'],
     why:{A:'CCaaS 是基礎建設，不做數據分析。',B:'Agent Assist 是即時協助真人，不是事後分析既有對話資料。',C:'Conversational Agents 是建聊天機器人，不是分析對話資料找趨勢。',D:'analyze their existing conversational data ＋ trends, sentiment, business intelligence = 事後分析對話資料抓洞察 → Conversational Insights。'}},
    {no:18, stem:'A research company needs to analyze several lengthy PDF documents containing financial reports and identify key performance indicators (KPIs) and their trends over the past year. They want a Google Cloud prebuilt generative AI tool that can process these documents and provide summarized insights directly from the source material with citations. What should the analyst do?',
     opts:['Create a custom Gem in Gemini Advanced with predefined KPIs to look across different financial reports.','Use the Gemini app to ask general financial trend questions.','Use NotebookLM to upload and analyze the documents.','Use Gemini for Google Workspace within Google Docs to copy and paste sections of the reports for summary and analysis.'],
     ans:'C', keys:['provide summarized insights directly from the source material with citations'],
     why:{A:'自訂 Gem 靠的是模型本身知識與你寫的指示，不是針對「上傳特定文件、附出處引用」這個需求設計的。',B:'Gemini app 一般問答不是針對你上傳的特定文件來回答，也不會附引用出處指回你的文件。',C:'process these documents ＋ summarized insights directly from source material with citations = 上傳文件、附出處引用 → NotebookLM（現行官方名 Gemini Notebook）。',D:'複製貼上片段進 Docs 是手動工作流程，不是「prebuilt generative AI tool」直接處理文件並附出處。'}},
    {no:57, stem:'A financial services company receives a high volume of loan applications daily submitted as scanned documents and PDFs with varying layouts. The manual process of extracting key information is time-consuming and prone to errors. This causes delays in loan processing and impacts customer satisfaction. The company wants to automate the extraction of this critical data to improve efficiency and accuracy. Which Google Cloud tool should they use?',
     opts:['Natural Language API','Dataflow','Vision AI','Document AI API'],
     ans:'D', keys:['scanned documents and PDFs with varying layouts','automate the extraction of this critical data'],
     why:{A:'Natural Language API 做的是情感分析、實體擷取於一般文字，不是針對不同版面的掃描表單做欄位擷取。',B:'Dataflow 是串流／批次資料處理管線工具，不是專門辨識文件版面、抽取欄位的 AI。',C:'Vision AI 一般是做影像辨識／物件偵測，不是針對文件欄位擷取最佳化的工具（Document AI 才是專門做文件理解）。',D:'scanned documents and PDFs with varying layouts ＋ extract key information = 掃描件抽欄位 → Document AI API。'}},
    {no:32, stem:`A learning and development team wants to quickly create a new hire training video with a custom avatar and voiceover that matches their company's branding and key messaging. They did not receive any money to spend on the production. What should they do?`,
     opts:['Generate the video frames with Imagen.','Prompt the Gemini app to create a video.','Train a model with Vertex AI and produce a video.','Create a video with Google Vids.'],
     ans:'D', keys:['training video','did not receive any money to spend on the production'],
     why:{A:'Imagen 只生靜態圖片，不是做影片的工具。',B:'Gemini app 不是設計給「生出完整培訓影片、含虛擬人像與配音」的專門工具。',C:'Vertex AI（現 Agent Platform）是訓練／部署模型的平台，不是快速免費做培訓影片的現成工具，也不符合「沒有預算」的情境。',D:'custom avatar and voiceover ＋ did not receive any money = 免費、內建虛擬人像配音的影片工具 → Google Vids。'}},
    {no:11, stem:'A software development team wants to use generative AI (gen AI) to code faster so they can launch their software prototype quicker. What should the team do?',
     opts:['Use gen AI to refactor and optimize existing code.','Use gen AI to suggest code snippets and complete functions.','Use gen AI to automatically generate comprehensive documentation for their code.','Use gen AI to identify potential bugs and security vulnerabilities in their code.'],
     ans:'B', keys:['code faster','suggest code snippets and complete functions'],
     why:{A:'重構和優化既有程式碼有助於品質，但不是直接加快「寫出新程式碼、快速做出雛形」這個動作本身。',B:'code faster ＋ suggest code snippets and complete functions = 自動補完程式碼片段，直接加速寫碼 → 最貼合「盡快做出原型」的需求。',C:'自動產生文件是額外工作，不會讓寫程式本身變快。',D:'抓 bug 和安全漏洞是品質把關，不是加快初期寫碼速度。'}},
    {no:71, stem:'A company has a machine learning project that involves diverse data types like streaming data and structured databases. How does Google Cloud support data gathering for this project?',
     opts:['Google Cloud provides tools such as Pub/Sub, Cloud Storage, and Cloud SQL.','The Gemini app is the primary Google Cloud tool for directly collecting data.',`Google Cloud's strengths are in the data analysis tools such as BigQuery.`,'Google Cloud relies on Vertex AI to connect to external data.'],
     ans:'A', keys:['streaming data and structured databases','Pub/Sub, Cloud Storage, and Cloud SQL'],
     why:{A:'streaming data（對到 Pub/Sub）＋ structured databases（對到 Cloud SQL）＋ Cloud Storage 放各種檔案 = 資料蒐集階段常用的三個工具組合，直接對應題目要的「多元資料類型」。',B:'Gemini app 是聊天助理，不是資料蒐集管線工具。',C:'BigQuery 是資料分析／查詢用的資料倉儲，題目問的是「蒐集」階段，不是分析階段。',D:'Vertex AI（現 Agent Platform）是建模訓練平台，不是負責串流／關聯式資料蒐集的工具，這裡沒有直接關係。'}}

/*L9*/{ id: 9, title: '負責任 AI＋資安', ch: 'Ch4 · 15%', ready: true,
  mind: '負責任 AI 題看<b>被質疑的是哪一點</b>：說不出理由？→ explainability；不透明、沒建立信任？→ transparency；對某群人不公平？→ fairness／bias；個資沒處理？→ privacy。資安題看<b>要管的是誰能用，還是整體資安總覽</b>。',
  cards: [
`<h3>🔍 Explainability：說得出為什麼</h3>
<p class="big">AI 做了一個決定（像核准或拒絕），要能講得出<b>為什麼</b>——不能是一個問不出理由的黑盒子。</p>
<p>🎨 畫面：貸款被拒，你問行員「為什麼」，行員要能講出具體原因，不能只說「電腦說不行」。</p>
<div class="kw"><span class="k en-t">explainability</span><span class="k en-t">explainable</span><span class="k en-t">gives no reasons</span><span class="k en-t">decision reasons</span><span class="k en-t">accountability</span></div>
<div class="ex"><span class="en-t">The company implements <mark>explainable</mark> gen AI policies so customers understand why their applications were rejected.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">考場常見劇情：AI 拒絕了某個人的申請，卻<b>講不出理由</b>——<span class="en-t">gives no reasons for rejection</span>——這就是在考 <span class="en-t">explainability</span>。</p>`,

`<h3>🪟 Transparency：先公開、先建立信任</h3>
<p class="big">在 AI 系統<b>上線之前</b>，就公開它是怎麼運作的、用了哪些資料，讓大家事先信任這套系統，不是等出事才解釋。</p>
<p>🎨 畫面：徵才公司在網站上先公告「我們用 AI 篩履歷，篩選標準跟用到的資料是這些」——不是等你被刷掉才跟你講。</p>
<div class="kw"><span class="k en-t">transparency</span><span class="k en-t">operate transparently</span><span class="k en-t">build trust</span><span class="k en-t">data usage</span><span class="k en-t">evaluation</span></div>
<div class="ex"><span class="en-t">The team ensures the AI <mark>operates transparently</mark>, especially regarding evaluation and <mark>data usage</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">判斷線索：<span class="en-t">explainability</span> 談的是「<b>單一個</b>決定為什麼這樣做」；<span class="en-t">transparency</span> 談的是「<b>整套系統</b>怎麼運作、用什麼資料，事先讓人信任」。看到 <span class="en-t">build trust</span>、招募／篩選這類還沒出事就想讓大家安心的情境，通常是 <span class="en-t">transparency</span>。</p>`,

`<h3>⚖️ Fairness／Bias：對某群人特別不利</h3>
<p class="big">模型的輸出對某一群人特別不利或有偏見，通常是因為<b>訓練資料本身不均衡</b>（某個族群、年齡層的樣本太少）。</p>
<p>🎨 畫面：訓練教材只收了某個地區的臉孔照片，AI 認其他地區的臉就認得特別差——這就是 <span class="en-t">bias</span>。</p>
<div class="kw"><span class="k en-t">bias</span><span class="k en-t">fairness</span><span class="k en-t">disproportionately</span><span class="k en-t">underrepresented</span></div>
<div class="ex"><span class="en-t">The training data is <mark>unbalanced</mark>, causing the model to be <mark>biased</mark> against underrepresented groups.</span><button class="speak">🔊</button></div>
<p class="tiny">⚠️ 常跟 <span class="en-t">explainability</span> 放在同一題互相干擾：如果題目的症狀是「說不出理由」，答案通常還是 <span class="en-t">explainability</span>，不是 <span class="en-t">fairness</span>——兩者問的是不同的事。</p>`,

`<h3>🕵️ Privacy／去識別化：先把身分藏起來</h3>
<p class="big">訓練資料如果含有個資（<b>PII</b>），要先<b>去識別化</b>再拿去訓練——不然模型可能把別人的個資學進去，之後又吐出來。</p>
<p>🎨 畫面：問卷回收上來，先把姓名電話塗黑才交給分析團隊——不是鎖起來不給人看，是把身分資訊本身弄不見。</p>
<div class="kw"><span class="k en-t">PII</span><span class="k en-t">personally identifiable information</span><span class="k en-t">anonymization</span><span class="k en-t">pseudonymization</span><span class="k en-t">de-identification</span></div>
<div class="ex"><span class="en-t">The company applies data <mark>anonymization</mark> techniques to remove or obscure sensitive data before training the model.</span><button class="speak">🔊</button></div>
<p class="tiny"><span class="en-t">anonymization</span>（匿名化）＝完全移除身分連結、還原不回來；<span class="en-t">pseudonymization</span>（假名化）＝換成代號，技術上還對得回去，但一般人看不出是誰。兩個都算<span class="en-t">de-identification</span>（去識別化）。</p>
<div class="box warn">⚠️ <span class="en-t">access control</span>（存取控制，誰能看檔案）保護的是「原始檔案」，防不了模型訓練時把 PII 學進權重裡——要在訓練資料<b>本身</b>先去識別化。</div>`,

`<h3>🛡️ SAIF：Google 的 AI 資安框架</h3>
<p class="big"><span class="en-t">SAIF</span>（<span class="en-t">Secure AI Framework</span>）是 Google 提出的一套<b>概念性框架</b>，教你怎麼把資安思維套用到 AI 系統的整個生命週期——它是一套做法／原則的集合，不是單一工具或按鈕。</p>
<p>🎨 畫面：像一份「AI 版的資安裝修規範」，告訴你做 AI 系統的每個階段該注意哪些資安細節。</p>
<div class="kw"><span class="k en-t">SAIF</span><span class="k en-t">Secure AI Framework</span><span class="k en-t">secure AI systems</span><span class="k en-t">throughout the lifecycle</span></div>
<div class="ex"><span class="en-t">Google provides a conceptual framework to help organizations <mark>secure their AI systems</mark> throughout the lifecycle.</span><button class="speak">🔊</button></div>
<p class="tiny">題目問「Google 專門為 AI 資安提出的<b>框架</b>叫什麼」，直接反射 <span class="en-t">SAIF</span>；它是「思維框架」，不是 <span class="en-t">IAM</span> 或 <span class="en-t">Security Command Center</span> 這種具體工具。</p>`,

`<h3>🔑 IAM vs 🖥️ Security Command Center</h3>
<p class="big">兩個常放在一起考，判斷靠「題目要管的是<b>誰能用</b>，還是<b>整體資安總覽</b>」。<span class="en-t">IAM</span> 管誰能存取、誰能看到哪些資源；<span class="en-t">Security Command Center</span> 是整個 Google Cloud 環境的資安健康總覽儀表板。</p>
<p>🎨 畫面：IAM 像大樓門禁卡——決定誰能進哪個房間；Security Command Center 像保全室的監視器牆——一眼看到整棟樓所有房間的異常狀況。</p>
<div class="kw"><span class="k en-t">Identity and Access Management</span><span class="k en-t">who can use</span><span class="k en-t">who can see</span><span class="k en-t">Security Command Center</span><span class="k en-t">centralized overview</span><span class="k en-t">entire environment</span></div>
<div class="ex"><span class="en-t">The security team needs a <mark>centralized platform</mark> for a <mark>comprehensive overview</mark> of security health across their entire environment.</span><button class="speak">🔊</button></div>
<p class="tiny">看到 <span class="en-t">who can use</span> / <span class="en-t">who can see</span> → IAM；看到 <span class="en-t">centralized</span> / <span class="en-t">comprehensive overview</span> / <span class="en-t">entire environment</span> → Security Command Center。</p>`,

`<h3>🔑 易混三兄弟一張表</h3>
<div class="tw"><table>
<tr><th>名詞</th><th>在問什麼</th><th>看到這些英文</th><th>生活比喻</th></tr>
<tr><td><b class="en-t">Explainability</b></td><td>這<b>一個決定</b>為什麼這樣做</td><td class="en-t">gives no reasons, explainable, decision reasons, accountability</td><td>行員能不能講出拒絕理由</td></tr>
<tr><td><b class="en-t">Transparency</b></td><td><b>整套系統</b>怎麼運作、用什麼資料、事先建信任</td><td class="en-t">operate transparently, build trust, data usage</td><td>徵才網站先公告篩選規則</td></tr>
<tr><td><b class="en-t">Fairness</b> / <span class="en-t">Bias</span></td><td>結果有沒有對<b>某群人</b>特別不利</td><td class="en-t">biased, unfair, disproportionately</td><td>訓練資料只收一種人的照片</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>問這一題為什麼→ <span class="en-t">explainability</span>；問要不要先講清楚讓人信任→ <span class="en-t">transparency</span>；問是不是對某群人特別差→ <span class="en-t">fairness</span>。</b></div>
<p class="tiny">（這是幫助判斷的<b>經驗法則，不是官方規則</b>——實際考題常常同時沾到兩個線索，先看題目<b>問的動作</b>是什麼。）</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：症狀是「說不出理由」，別跳去公平性評估</b><br>
題目講 <span class="en-t">gives no reasons for rejection</span>（說不出拒絕理由），正確方向是 <span class="en-t">explainability</span>；<span class="en-t">fairness assessments</span>（公平性評估）是檢查有沒有偏誤的預防性工作，回答不了「這一個決定為什麼這樣」。</div>
<div class="box warn"><b>誘餌 2：存取控制救不了訓練資料裡的 PII</b><br>
<span class="en-t">access controls</span> 只能擋住「人」偷看原始檔案，擋不住模型訓練時把 PII 學進權重再吐出來——資料裡有 PII，要先<b>去識別化</b>，不是加強誰能看檔案。</div>
<div class="box warn"><b>誘餌 3：ML 生命週期，認清「現在是哪個階段」</b><br>
題目講<b>蒐集資料</b>階段，重點是 <span class="en-t">access controls</span> ＋ 保護訓練資料裡的敏感資訊；打補丁、監控意外輸出、訂倫理準則，都是<b>別的階段</b>的事，別選錯階段。</div>
<div class="box warn"><b>誘餌 4：規則死板的決策，根本不該交給 Gemini</b><br>
題目講 <span class="en-t">deterministically</span>（決定論式）、<span class="en-t">strict predefined criteria</span>（嚴格既定規則）→ 這種任務該用規則引擎，不該用生成式模型。<b>不是每件事都該用 gen AI</b>——Gemini 的專長是彈性生成與推論，不是死規則判斷。<br><span class="tiny">⚠️ 別跟第 10 課 NO.28 搞混：那題問「哪些工作適合交給 AI 自動化」，答案是重複、有規則的雜事；這題問的是讓 Gemini 當「每次結果都必須一模一樣」的核准引擎——兩題問的事情不同。</span></div>
<p>看完了 🎉 接下來換你動手：② 先練「看到英文片語 → 反射出是哪一個」。</p>`

     opts:["Yes, because access controls prevent unauthorized employees from viewing the data.","No, because the model could still learn and later reproduce the personal information unless it is de-identified first.","Yes, because the data is already stored securely in Google Cloud.","No, because the company should first apply for a wider IAM policy."], ans:'B',

     why:{A:'⚠️ 雙陷阱：存取控制確實能防止「人」偷看原始檔案，但防不了「模型」把個資學進權重裡再吐出來，題目問的是訓練前的資料本身夠不夠安全。',B:'access controls 只保護原始檔案，模型訓練時仍可能記住姓名、聯絡方式並在之後輸出——要先做去識別化（anonymization／pseudonymization）才夠。',C:'儲存安全跟訓練資料本身有沒有先去識別化是兩回事。',D:'IAM 管的是誰能存取系統資源，跟訓練資料需要先去識別化無關，擴大 IAM 權限範圍反而方向錯誤。'}},
    {stem:"A Google Cloud customer asks which framework Google recommends specifically for building security into AI systems throughout their lifecycle, from design to deployment. Which of the following should the customer be pointed to?",
     opts:["Google's Secure AI Framework (SAIF)","Identity and Access Management (IAM)","Security Command Center","Workload monitoring tools"], ans:'A',
     key:'framework Google recommends specifically for building security into AI systems',
     why:{A:'framework … for building security into AI systems throughout their lifecycle = Google 提出的整套 AI 資安框架 → SAIF。',B:'IAM 只是實務上會用到的其中一項存取控管工具，管誰能存取，不是整套框架本身。',C:'Security Command Center 是資安總覽儀表板，不是「框架」。',D:'workload monitoring tools 只是監控工具，不是整套框架。'}}
  ],
  exam: [
    {no:26, stem:'An organization wants granular control over who can use and see their generative AI models and related resources on Google Cloud. Which Google Cloud security offering is specifically for this purpose?',
     opts:['Identity and Access Management','Secure-by-design infrastructure','Security Command Center','Workload monitoring tools'],
     ans:'A', keys:['who can use and see'],
     why:{A:'who can use and see = 誰能用、誰能看，管存取權限 → IAM。',B:'secure-by-design infrastructure 是基礎建設本身的安全設計，不是「管誰能用」的存取控管機制。',C:'Security Command Center 是全域資安總覽儀表板，不是專門管「誰能用誰能看」的工具。',D:'workload monitoring tools 是監控執行狀況，不是存取權限控管。'}},
    {no:50, stem:"A security team needs a centralized platform to gain a comprehensive overview of their organization's security health across their entire Google Cloud environment, including potential threats to their generative AI deployments. Which Google Cloud security offering is specifically for this purpose?",
     opts:['Workload monitoring tools','Security Command Center','Identity and Access Management','Secure-by-design infrastructure'],
     ans:'B', keys:['centralized platform','comprehensive overview','entire Google Cloud environment'],
     why:{A:'workload monitoring tools 只監控個別工作負載的執行狀況，不是「整個環境」的資安總覽。',B:'centralized platform ＋ comprehensive overview ＋ entire environment = 全域資安健康總覽 → Security Command Center。',C:'IAM 管的是誰能存取什麼，不是提供整體資安健康總覽。',D:'secure-by-design infrastructure 是基礎建設本身的安全設計，不是一個「總覽平台」。'}},
    {no:20, stem:'A company is developing a generative AI application to analyze customer feedback collected through online surveys. Stakeholders are concerned about potential privacy risks associated with this data, as the feedback contains personally identifiable information (PII). They need to mitigate these risks before using the data to train the AI model. What action should the company prioritize?',
     opts:['Focusing on collecting only quantitative feedback data in future surveys.','Ensuring that the AI model is trained on a large and diverse dataset.','Implementing strong access controls to limit which teams can view the raw survey data.','Applying data anonymization techniques to remove or obscure sensitive data.'],
     ans:'D', keys:['personally identifiable information (PII)','before using the data to train'],
     why:{A:'只蒐集量化資料是改變「未來」問卷設計，不會處理「現在」已經蒐集到、含有 PII 的資料。',B:'資料量大、多元只影響準確度，不會降低個資外洩風險，甚至可能讓更多 PII 進到訓練資料裡。',C:'存取控制只能防止「人」看到原始檔案，防不了模型訓練時把 PII 學進權重、之後又吐出來。',D:'訓練前先做匿名化，移除或遮蔽敏感資料，才能真正降低訓練資料含 PII 的風險。'}},
    {no:23, stem:'An organization is collecting data to train a generative AI model for customer service. They want to ensure security throughout the ML lifecycle. What is a critical consideration at this stage?',
     opts:['Implementing access controls and protecting sensitive information within the training data.','Applying the latest software patches to the AI model on a regular basis.','Establishing ethical guidelines for AI model responses to ensure fairness and avoid harm.',"Monitoring the AI model's performance for unexpected outputs and potential errors."],
     ans:'A', keys:['collecting data','at this stage'],
     why:{A:'collecting data 這個階段的資安重點就是「存取控制＋保護訓練資料中的敏感資訊」，題目問的正是這一階段。',B:'定期打補丁是「模型部署後維運」階段的事，不是資料蒐集階段的重點。',C:'倫理準則屬於「模型設計／回應規範」階段，跟這裡問的「蒐集資料階段」不同。',D:'監控意外輸出是「模型上線後」的持續監控工作，不是資料蒐集階段。'}},
    {no:31, stem:'A financial institution uses generative AI (gen AI) to approve and reject loan applications, but gives no reasons for rejection. Customers are starting to file complaints. The company needs to implement a solution to reduce the complaints. What should the company do?',
     opts:['Collect a larger and more diverse dataset for the gen AI model.','Implement explainable gen AI policies.','Fine-tune the gen AI model.','Develop fairness assessments for the gen AI model.'],
     ans:'B', keys:['gives no reasons for rejection'],
     why:{A:'資料量大不會讓模型「講出理由」，跟客訴的核心問題（說不出為什麼）無關。',B:'gives no reasons for rejection = 說不出理由 → 要讓 AI 決策可解釋 → explainable gen AI policies。',C:'微調模型只是重新訓練，不會讓模型自動變得「會解釋」。',D:'公平性評估是檢查有沒有偏誤，題目的癥狀是「說不出理由」，不是「結果不公平」，兩者是不同問題。'}},
    {no:70, stem:'A home loan company is deploying a generative AI system to automate initial loan application reviews. Several applicants have been unexpectedly rejected, leading to customer complaints and potential bias concerns. They need to ensure responsible and fair lending practices. What aspect of the AI system should they prioritize?',
     opts:["Implementing stricter data security measures to protect applicants' financial information from unauthorized access.",'Ensuring AI decision-making is explainable to understand decision reasons and establish accountability.','Increasing the speed at which the AI system processes loan applications to handle the high volume.','Regularly updating the AI model with more financial data to improve its accuracy over time.'],
     ans:'B', keys:['unexpectedly rejected','understand decision reasons'],
     why:{A:'資料安全防的是資料外洩，跟「為什麼被拒」這個核心疑問無關。',B:'unexpectedly rejected ＋ 需要 establish accountability = 要能理解決策理由、建立問責 → explainability，與 NO.31 是同一套判準。',C:'處理速度跟能不能解釋決策理由無關。',D:'更新更多資料只影響準確度，不會讓決策變得可解釋。'}},
    {no:62, stem:'A human resources team is implementing a new generative AI application to assist the department in screening a large volume of job applications. They want to ensure fairness and build trust with potential candidates. What should the team prioritize?',
     opts:['Integrating the AI application with various job boards to maximize candidate reach.','Focusing on minimizing the processing time for each application to improve efficiency.','Ensuring AI operates transparently, especially regarding application evaluation and data usage.','Ensuring that the AI application can automatically rank all candidates without requiring human review.'],
     ans:'C', keys:['build trust with potential candidates','operates transparently'],
     why:{A:'串接更多求職網站只是擴大觸及率，跟建立信任或公平無關。',B:'縮短處理時間是效率考量，不是信任或公平的重點。',C:'build trust ＋ operate transparently, especially … evaluation and data usage = 公開評估方式與資料使用 → transparency，直接對應「建立信任」的需求。',D:'完全自動排序、不做人工複核，在招募這種敏感場景反而會降低公平性與信任，方向錯誤。'}},
    {no:65, stem:'A highly regulated financial institution wants to use Gemini as the core decision engine for a loan approval system that will deterministically approve or reject loan applications based on a strict set of predefined criteria. Why is this an inappropriate use case for Gemini?',
     opts:['Gemini cannot integrate with required financial databases.','Gemini is not equipped to handle structured numerical data for financial assessments.','Gemini is designed for flexible content generation and inference, not rigid rule-based decisions.','Gemini deployment for this scenario would be too expensive and complex.'],
     ans:'C', keys:['deterministically approve or reject','strict set of predefined criteria'],
     why:{A:'題目沒有講到資料庫整合的技術限制，這不是這裡的重點。',B:'Gemini 可以處理結構化數字資料，問題不在「能不能處理數字」，是在「該不該用生成式模型做死規則決策」。',C:'deterministically ＋ strict set of predefined criteria = 決定論式、死規則的判斷 → 這種任務該用規則引擎，不該交給以彈性生成與推論見長的 Gemini（不是每件事都該用 gen AI）。',D:'題目沒有提到成本或複雜度的考量，這不是被問的重點。'}}

/*L10*/{ id: 10, title: '企業導入策略', ch: 'Ch4 · 15%', ready: true,
  mind: 'Leader 題的正解幾乎都在講同一件事：<b>先想商業問題、找高影響力用例、選對現成的東西快速上線、避免被綁死</b>——不是一上來就從零訓練模型。',
  cards: [
`<h3>🎯 Problem-first：先想商業問題，不是先挑技術</h3>
<p class="big">Google Cloud 建議的第一步不是「要用哪個模型」，而是先確認「我們公司想解決什麼具體商業問題、想要什麼成果」。</p>
<p>🎨 畫面：先想清楚「我要去哪裡」，再決定坐飛機還是搭高鐵，不是先訂了機票才想去哪。</p>
<div class="kw"><span class="k en-t">problem-first</span><span class="k en-t">business problems</span><span class="k en-t">desired outcomes</span><span class="k en-t">determine first</span></div>
<div class="ex"><span class="en-t">The organization should first determine <mark>the specific business problems</mark> it aims to solve and the <mark>desired outcomes</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>`,

`<h3>🏢 Top-down 定方向、Bottom-up 找用例</h3>
<p class="big">高層（executive leadership）用 <span class="en-t">top-down</span> 訂出整體 AI 策略方向；中階主管（mid-level managers）用 <span class="en-t">bottom-up</span> 從自己團隊的日常工作裡，挖出高影響力、做得到的用例。</p>
<p>🎨 畫面：總公司定「今年要往環保轉型」的大方向（top-down），各分店店長自己想「我們店可以先從減少包裝做起」（bottom-up）。</p>
<div class="kw"><span class="k en-t">top-down strategy</span><span class="k en-t">bottom-up</span><span class="k en-t">mid-level managers</span><span class="k en-t">drive adoption</span></div>
<div class="ex"><span class="en-t">Mid-level managers <mark>drive gen AI adoption</mark> by identifying high-impact, feasible solutions within their workflows.</span><button class="speak">🔊</button></div>
<p class="tiny">📘 官方學習指南的原文：整體策略 top-down 由高層訂；bottom-up 是<b>員工</b>（employees）從實際工作裡找出能用的應用。考古題 NO.24 用的是 <span class="en-t">mid-level managers</span>（中階主管）這個說法，所以這張卡配合考題講中階主管——兩種講法都要認得。</p>`,

`<h3>🔍 挑用例：高影響力、可行、有規則可循的先做</h3>
<p class="big">找 use case 要挑「有影響力又做得到」的；自動化任務優先挑「重複、有規則可循」的，不是複雜、需要人判斷或高度創意的。</p>
<p>🎨 畫面：先把最常做、最花時間、規則固定的雜事交給機器人（像每天固定格式的報表），複雜的策略決策還是人來做。</p>
<div class="kw"><span class="k en-t">high-impact</span><span class="k en-t">feasible</span><span class="k en-t">repetitive and rule-based</span></div>
<div class="ex"><span class="en-t">Generative AI is best used to automate tasks that are <mark>repetitive and rule-based</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">用在幫忙、不是取代：像業務團隊用 gen AI <span class="en-t">draft emails</span>（草擬郵件）、<span class="en-t">provide real-time insights</span>（即時洞察），人繼續做關係經營、成交這種需要判斷力的事。</p>

     opts:["When tasks are highly creative and require original thought.","When tasks involve sensitive information or require human oversight","When tasks are repetitive and rule-based.","When tasks are complex and require strategic decision-making."],
     ans:'C', keys:["repetitive and rule-based"],
     why:{A:'高度創意、需要原創思考的任務通常還是需要人的判斷，不是自動化的優先對象。',B:'涉及敏感資訊或需要人類監督的任務，正是該保留人在中間把關，不是直接自動化的首選。',C:'repetitive and rule-based = 重複且有規則可循 → 這種「雜事」最適合交給 gen AI 自動化，把創意、敏感、策略判斷留給人。⚠️ 別跟第 9 課 NO.65 搞混：那題問的是讓 Gemini 當「每次結果都必須一模一樣」的核准引擎，那就不適合。',D:'複雜、需要策略決策的任務需要人的判斷力，不是自動化該優先處理的類型。'}},
    {no:13, stem:"A sales manager wants to responsibly use generative AI (gen AI) to increase efficiency with their existing tasks. They want to allow the sales team to focus on building customer relationships and closing deals. How should the sales team use gen AI?",

    {no:38, stem:"A company's development team is eager to start building generative AI solutions with Google Cloud, but has limited experience in AI development. They need to launch their gen AI solution quickly. What Google Cloud benefit would help the company achieve their goal?",
     opts:["Google Cloud's pre-trained models and low- and no-code AI tools and services.","Google Cloud's collaborative AI community and support forums connect developers with AI experts.","Google Cloud's comprehensive training materials and tutorials to help developers.","Google Cloud's focus on continuous improvement provides access to the latest AI tools, features, and best practices."],

    {no:27, stem:"A company wants to adopt generative AI and is concerned about vendor lock-in. They want to maintain flexibility in their technology stack. What Google Cloud strength would ease their concerns?",
