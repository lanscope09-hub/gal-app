function saveS(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }
let S = loadS();
function LS(id){ if(!S.l[id]) S.l[id] = {done:{}, s2:[], s3:[], s4:[], ex:{a:{},g:{},m:{},r:{},t:{},done:{},sub:false}}; return S.l[id]; }
const UI = { view:'home', id:null, stage:1, i:0, sel:[], phase:'hunt', showNo:null };
const L = () => LESSONS.find(x => x.id === UI.id);
const $app = document.getElementById('app');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LET = ['A','B','C','D'];

/* ======================= 共用工具 ======================= */
function wrapWords(root){
  root.querySelectorAll('.en-t').forEach(el => {
    const wk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = []; while (wk.nextNode()) nodes.push(wk.currentNode);
    nodes.forEach(n => {
      if (n.parentElement && n.parentElement.closest('.w')) return;
      const parts = n.nodeValue.split(/([A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z])/);
      if (parts.length < 2) return;
      const f = document.createDocumentFragment();
      parts.forEach((p,i) => {
        if (i % 2) { const s = document.createElement('span'); s.className = 'w'; s.textContent = p; f.appendChild(s); }
        else if (p) f.appendChild(document.createTextNode(p));
      });
      n.replaceWith(f);
    });
  });
}
function say(t){ try { if(!t) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.85; speechSynthesis.speak(u); } catch(e){} }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._h); toast._h = setTimeout(()=> t.hidden = true, 2200); }
function getVocab(){ try { return JSON.parse(localStorage.getItem(VOCAB_KEY)) || {}; } catch(e){ return {}; } }
function addVocab(word, zh, origin, example){
  const st = getVocab(); const k = word.toLowerCase();
  if (st[k]) { st[k].count = (st[k].count||0) + 1; st[k].lastAddedAt = new Date().toISOString(); }
  else st[k] = { word, zh: zh || '待補', role:'課程標記', chain:'', hook:'', example: example||'', scenario:'', origin, count:1, firstAddedAt:new Date().toISOString() };
  try { localStorage.setItem(VOCAB_KEY, JSON.stringify(st)); } catch(e){}
  return st[k].count;
}
function copyText(t){
  const done = () => toast('✅ 已複製，貼給麥口就行');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請手動選取'); } ta.remove(); }
}

/* 點字：學習模式 → 跳中文；驗收模式 → 只標記（交卷後才給中文） */
let popWord = null;
function openPop(word){
  const r = lookup(word); popWord = { word: r.key, zh: r.zh };
  const cnt = (getVocab()[r.key] || {}).count || 0;
  const p = document.getElementById('pop');
  p.innerHTML = `<div class="row"><span class="pw">${esc(r.key)}</span><button class="speak" data-say="${esc(r.key)}">🔊</button><span class="sp"></span><button class="btn sm" onclick="closePop()">✕</button></div>
    <div class="pz">${r.zh ? esc(r.zh) : '<span class="muted">課程字典沒收錄這個字</span>'}</div>
    <div class="row"><button class="btn sm pri" onclick="popAdd()">➕ 加入生字庫${cnt?`（已標 ${cnt} 次）`:''}</button>
    <a class="tiny" target="_blank" href="https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${encodeURIComponent(r.key)}">劍橋字典 ↗</a></div>`;
  p.hidden = false;
}
function closePop(){ document.getElementById('pop').hidden = true; }
function popAdd(){ if(!popWord) return; const c = addVocab(popWord.word, popWord.zh, `GAL課程 第${UI.id}課`); toast(`✅ "${popWord.word}" 已進生字庫（累計 ${c} 次）`); closePop(); }

document.addEventListener('click', e => {
  const sp = e.target.closest('.speak');
  if (sp) { const ex = sp.closest('.ex'); say(sp.dataset.say || (ex && ex.querySelector('.en-t') ? ex.querySelector('.en-t').textContent : '')); return; }
  const w = e.target.closest('.w');
  if (w) {
    const m = w.closest('[data-mode]'); const mode = m ? m.dataset.mode : 'learn';
    if (mode === 'exam') { e.preventDefault(); e.stopPropagation(); toggleMark(w); return; }
    if (mode === 'learn') { openPop(w.textContent); return; }
  }
  if (!e.target.closest('#pop')) closePop();
}, true);

/* ======================= 首頁 ======================= */
function statusOf(l){
  if (!l.ready) return '<span class="chip">製作中</span>';
  const s = S.l[l.id]; if (!s) return '<span class="chip b">未開始</span>';
  if (s.ex && s.ex.sub) return s.green ? '<span class="chip g">✅ 轉綠</span>' : `<span class="chip y">🟡 驗收 ${s.score}/${l.exam.length}，待複習</span>`;
  const n = Object.keys(s.done).length; return `<span class="chip b">進行中 ${n}/5</span>`;
}
function renderHome(){
  const now = new Date(); const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((EXAM_DATE - t0) / 86400000);
  const md = String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  $app.innerHTML = `
  <header class="top"><div class="row"><h1>🎓 GAL 互動課程</h1><span class="sp"></span><span class="chip y">距 9/17 考試 ${days} 天</span></div></header>
  ${SCHEDULE[md] ? `<div class="box key"><b>📅 今天的目標：</b>${SCHEDULE[md]}</div>` : ''}
  <div class="box">
    <b>每一課都是五步，中文慢慢退場、英文慢慢加重：</b>
    <div class="tiny" style="margin-top:6px;line-height:1.9">
    ① <b>懂</b>：中文講觀念，英文鑰匙字先認臉<br>
    ② <b>認</b>：看英文片語 → 反射出是哪個觀念<br>
    ③ <b>抓</b>：在英文題目裡點出「決定答案的那幾個字」（考場最重要的技能）<br>
    ④ <b>判</b>：全英文新題，答完才出中文解析<br>
    ⑤ <b>驗收</b>：考古原題，照考場規格——沒提示、不翻譯；一題一題寫，寫完馬上看解析
    </div>
    <div class="tiny" style="margin-top:6px">💡 看不懂的英文字直接點（驗收時點字只會標橘色，看解析才給中文）。標過的字會進生字庫，跟 <a href="GAL刷題卡.html" style="color:var(--acc)">GAL刷題卡</a> 共用。</div>
  </div>
  ${revCount() ? `<div class="box warn row"><div class="sp"><b>🔁 複習區：${revCount()} 題</b><div class="tiny">答錯或勾了「猜的」的題。開新課前先清一清——隔天再考還對，才是真的會。</div></div><button class="btn pri" onclick="openRev()">開始複習</button></div>` : ''}
  <h2>課程</h2>
  ${LESSONS.map(l => `<div class="lc ${l.ready?'':'soon'}" ${l.ready?`onclick="openLesson(${l.id})"`:''}>
     <div class="n">${l.id}</div><div class="sp"><div class="t">${l.title}</div><div class="tiny">${l.ch}</div></div>${statusOf(l)}</div>`).join('')}
  <p class="tiny">進度存在這台電腦的瀏覽器裡，關掉再開也會留著。</p>`;
}
function openLesson(id){
  UI.view='lesson'; UI.id=id; const s = LS(id);
  UI.stage = s.ex.sub ? 5 : ([1,2,3,4,5].find(n => !s.done[n]) || 1);
  UI.i = 0; UI.sel = []; UI.phase = 'hunt'; UI.showNo = null; UI.qNo = null;
  render(); window.scrollTo(0,0);
}
function goStage(n){ UI.stage = n; UI.i = 0; UI.sel = []; UI.phase='hunt'; UI.showNo=null; render(); window.scrollTo(0,0); }
function goHome(){ UI.view='home'; render(); window.scrollTo(0,0); }

/* ======================= 課程頁 ======================= */
function render(){
  closePop();
  if (UI.view === 'home') return renderHome();
  if (UI.view === 'rev') return renderRev();
  const l = L(), s = LS(l.id);
  const head = `<header class="top"><div class="row"><button class="btn sm" onclick="goHome()">← 課程列表</button><b>第 ${l.id} 課</b><span class="tiny">${l.title}</span></div>
    <div class="steps">${STEPS.map((t,i) => `<span class="step ${UI.stage===i+1?'cur':''} ${s.done[i+1]?'ok':''}" onclick="goStage(${i+1})">${t}</span>`).join('')}</div></header>`;
  const body = [null, st1, st2, st3, st4, st5][UI.stage](l, s);
  $app.innerHTML = head + body;
  wrapWords($app);
  if (UI.stage === 5) restoreMarks();
}
function markDone(n){ const s = LS(UI.id); s.done[n] = true; saveS(); }
function progress(i, n){ return `<div class="prog"><i style="width:${Math.round(i/n*100)}%"></i></div>`; }

/* ① 懂 */
function st1(l){
  const n = l.cards.length, i = Math.min(UI.i, n-1);
  return `<div class="box"><b>🎯 心法：</b>${l.mind}</div>${progress(i+1, n)}
   <div class="box" data-mode="learn">${l.cards[i]}</div>
   <div class="nav"><button class="btn" ${i===0?'disabled':''} onclick="UI.i--;render()">← 上一張</button><span class="tiny">${i+1} / ${n}</span>
   ${i < n-1 ? `<button class="btn pri" onclick="UI.i++;render();window.scrollTo(0,0)">下一張 →</button>` : `<button class="btn pri" onclick="markDone(1);goStage(2)">✅ 看完了，去 ② 認</button>`}</div>`;
}

/* ② 認：英文片語 → 觀念 */
function st2(l, s){
  const n = l.match.length;
  if (UI.i >= n) {
    const ok = s.s2.filter(Boolean).length;
    return `<div class="box"><div class="res">${ok} / ${n}</div><p>${ok===n?'全對！英文片語反射很穩 💪':'錯的那幾個再看一眼解析，等一下 ③ 會再遇到類似的字。'}</p>
      <div class="row"><button class="btn" onclick="s2Reset()">🔁 再練一次</button><button class="btn pri" onclick="goStage(3)">去 ③ 抓 →</button></div></div>`;
  }
  const it = l.match[UI.i], pick = s.s2[UI.i] === undefined ? null : UI._p2;
  const answered = s.s2[UI.i] !== undefined && UI._p2 !== undefined;
  return `${progress(UI.i, n)}<p class="tiny">第 ${UI.i+1} / ${n} 題 · 這句英文在講哪一個？</p>
   <div class="box" data-mode="learn"><div class="big en-t">${esc(it.en)}</div><button class="speak" data-say="${esc(it.en)}">🔊 唸給我聽</button></div>
   ${it.opts.map(o => { let c=''; if(answered){ c = o===it.ans ? 'ok' : (o===UI._p2 ? 'bad' : 'dim'); }
      return `<button class="opt ${c}" ${answered?'disabled':''} onclick="s2Pick(${it.opts.indexOf(o)})">${esc(o)}</button>`; }).join('')}
   ${answered ? `<div class="fb ${UI._p2===it.ans?'ok':'bad'}">${UI._p2===it.ans?'✅ 對！':'❌ 正解是 '+it.ans+'。'} ${it.why}</div>
     <div class="nav"><span></span><button class="btn pri" onclick="s2Next()">下一題 →</button></div>` : ''}`;
}
function s2Pick(k){ const l=L(), s=LS(l.id), o=l.match[UI.i].opts[k]; UI._p2 = o; s.s2[UI.i] = (o === l.match[UI.i].ans); saveS(); render(); }
function s2Next(){ UI._p2 = undefined; UI.i++; if (UI.i >= L().match.length) markDone(2); render(); }
function s2Reset(){ LS(UI.id).s2 = []; saveS(); UI.i = 0; UI._p2 = undefined; render(); }

/* ③ 抓：點出決定答案的片段 */
function st3(l, s){
  const n = l.hunt.length;
  if (UI.i >= n) {
    const ok = s.s3.filter(Boolean).length;
    return `<div class="box"><div class="res">${ok} / ${n}</div><p>考場上題目很長，你不用每個字都懂——<b>只要抓到那幾個鑰匙片段就夠了</b>。這就是你剛剛在練的事。</p>
      <div class="row"><button class="btn" onclick="LS(UI.id).s3=[];saveS();UI.i=0;UI.phase='hunt';UI.sel=[];render()">🔁 再練一次</button><button class="btn pri" onclick="goStage(4)">去 ④ 判 →</button></div></div>`;
  }
  const it = l.hunt[UI.i];
  if (UI.phase === 'hunt') {
    return `${progress(UI.i, n)}<p class="tiny">第 ${UI.i+1} / ${n} 題 · <b>步驟 1：</b>點出你覺得「決定答案」的片段（可以點好幾段），再按確認。</p>
     <div class="box big en-w">${it.chunks.map((c,k) => `<span class="ck ${UI.sel.includes(k)?'sel':''}" onclick="s3Tog(${k})">${esc(c)}</span>`).join('')}</div>
     <div class="nav"><span></span><button class="btn pri" ${UI.sel.length?'':'disabled'} onclick="UI.phase='pick';render()">確認鑰匙片段 →</button></div>`;
  }
  const hit = UI.sel.filter(k => it.keys.includes(k)).length;
  const sent = it.chunks.map((c,k) => `<span class="ck ${it.keys.includes(k)?'key':(UI.sel.includes(k)?'miss':'')}">${esc(c)}</span>`).join('');
  const answered = UI.phase === 'done';
  return `${progress(UI.i, n)}<div class="box big en-t" data-mode="learn">${sent}</div>
   <p class="tiny">🟩 綠色 = 鑰匙片段 ${UI.sel.some(k=>!it.keys.includes(k))?'· 🟥 紅色 = 你點了但不是關鍵':''} · 你抓到 ${hit} / ${it.keys.length} 段</p>
   <p><b>步驟 2：</b>所以答案是？</p>
   ${it.opts.map(o => { let c=''; if(answered){ c = o===it.ans?'ok':(o===UI._p3?'bad':'dim'); }
     return `<button class="opt ${c}" ${answered?'disabled':''} onclick="s3Pick(${it.opts.indexOf(o)})">${esc(o)}</button>`; }).join('')}
   ${answered ? `<div class="fb ${UI._p3===it.ans?'ok':'bad'}">${UI._p3===it.ans?'✅ 對！':'❌ 正解是 '+it.ans+'。'} ${it.why}</div>
     <div class="nav"><span></span><button class="btn pri" onclick="s3Next()">下一題 →</button></div>` : ''}`;
}
function s3Tog(k){ UI.sel = UI.sel.includes(k) ? UI.sel.filter(x=>x!==k) : UI.sel.concat(k); render(); }
function s3Pick(k){ const l=L(), s=LS(l.id), it=l.hunt[UI.i], o=it.opts[k]; UI._p3=o; const hit = UI.sel.some(k=>it.keys.includes(k)); s.s3[UI.i] = (o===it.ans && hit); UI.phase='done'; saveS(); render(); }
function s3Next(){ UI.i++; UI.sel=[]; UI.phase='hunt'; UI._p3=undefined; if (UI.i >= L().hunt.length) markDone(3); render(); }

/* ④ 判：全英文新題 */
function st4(l, s){
  const n = l.mcq.length;
  if (UI.i >= n) {
    const ok = s.s4.filter(Boolean).length;
    return `<div class="box"><div class="res">${ok} / ${n}</div><p>${ok===n?'全英文情境全對，可以上考場原題了。':'錯的那題記得它的誘餌長什麼樣子，⑤ 會再遇到。'}</p>
      <div class="row"><button class="btn" onclick="LS(UI.id).s4=[];saveS();UI.i=0;UI._p4=undefined;render()">🔁 再練一次</button><button class="btn pri" onclick="goStage(5)">去 ⑤ 驗收 →</button></div></div>`;
  }
  const it = l.mcq[UI.i], answered = UI._p4 !== undefined;
  const stem = answered ? boldKeys(it.stem, [it.key]) : esc(it.stem);
  return `${progress(UI.i, n)}<p class="tiny">第 ${UI.i+1} / ${n} 題 · 全英文，答完才有中文</p>
   <div class="box" data-mode="${answered?'learn':'none'}"><div class="big en-t">${stem}</div>
   ${it.opts.map((o,k) => { const L_ = LET[k]; let c=''; if(answered){ c = L_===it.ans?'ok':(L_===UI._p4?'bad':'dim'); }
     return `<button class="opt ${c}" ${answered?'disabled':''} onclick="s4Pick('${L_}')"><b>${L_}.</b> <span class="en-t">${answered ? boldKeys(o, [it.key]) : esc(o)}</span>${answered?`<div class="tiny" style="color:#c4d2e8;margin-top:4px">${it.why[L_]}</div>`:''}</button>`; }).join('')}
   </div>
   ${answered ? `<div class="fb ${UI._p4===it.ans?'ok':'bad'}">${UI._p4===it.ans?'✅ 對！':'❌ 正解是 '+it.ans+'。'} 決勝片段：<b class="key en-t">${esc(it.key)}</b></div>
     <div class="nav"><span></span><button class="btn pri" onclick="s4Next()">下一題 →</button></div>` : ''}`;
}
function s4Pick(k){ const l=L(), s=LS(l.id); UI._p4 = k; s.s4[UI.i] = (k === l.mcq[UI.i].ans); saveS(); render(); }
function s4Next(){ UI._p4 = undefined; UI.i++; if (UI.i >= L().mcq.length) markDone(4); render(); window.scrollTo(0,0); }
function boldKeys(text, keys){
  let h = esc(text);
  keys.forEach(k => { const ek = esc(k); const i = h.indexOf(ek); if (i >= 0) h = h.slice(0,i) + `<b class="key">${ek}</b>` + h.slice(i+ek.length); });
  return h;
}

/* ⑤ 驗收＋🔁 複習區：一題一題寫、寫完馬上解析 */
function QBANK(){ const m = {}; LESSONS.forEach(l => (l.exam||[]).forEach(q => { m[q.no] = Object.assign({ lid: l.id }, q); })); return m; }
function curE(){ return UI.view === 'rev' ? UI.rv : LS(UI.id).ex; }
function fmtSec(s){ s = Math.round(s||0); return s >= 60 ? `${Math.floor(s/60)} 分 ${s%60} 秒` : `${s} 秒`; }
function curQ(l, E){ return l.exam.find(q => !E.done[q.no]); }
function qForm(q, E, idx, n){
  if (UI.qNo !== q.no) { UI.qNo = q.no; UI.qStart = Date.now(); }
  const pick = E.a[q.no];
  return `${progress(idx, n)}<p class="tiny">第 ${idx+1} / ${n} 題 · 考場規格：全英文、沒提示</p>
   <div class="xq" data-mode="exam" data-q="${q.no}">
     <div class="no">NO.${q.no}</div>
     <div class="stem en-t">${esc(q.stem)}</div>
     <div class="tiny" style="margin:-4px 0 6px">👉 點<b>圓圈字母</b>＝選答案　·　點<b>英文字</b>＝標生字（變橘色，看解析時才給中文）</div>
     ${q.opts.map((o,k) => `<div class="xo ${pick===LET[k]?'on':''}" data-l="${LET[k]}"><button class="lt" onclick="xPick(${q.no},'${LET[k]}')">${LET[k]}</button><span class="en-t">${esc(o)}</span></div>`).join('')}
     <label class="guess"><input type="checkbox" ${E.g[q.no]?'checked':''} onchange="xGuess(${q.no},this.checked)"> 🤔 我是猜的／不確定</label>
     <textarea placeholder="我的判斷理由（選填，會一起帶給麥口）" oninput="xWhy(${q.no},this.value)">${esc(E.r[q.no]||'')}</textarea>
     <div class="nav"><span></span><button class="btn pri" id="xok" ${pick?'':'disabled'} onclick="xConfirm(${q.no})">確認作答，看解析 →</button></div>
   </div>`;
}
function st5(l, s){
  const E = s.ex; E.done = E.done || {}; E.t = E.t || {};
  if (E.sub) return st5Summary(l, s);
  const n = l.exam.length;
  if (UI.showNo) {
    const q = l.exam.find(x => x.no === UI.showNo), idx = l.exam.indexOf(q);
    return `${progress(idx+1, n)}<p class="tiny">第 ${idx+1} / ${n} 題 · 解析</p>${qReview(q, E)}
      <div class="nav"><span></span><button class="btn pri" onclick="xNext()">${curQ(l, E) ? '下一題 →' : '看總結 →'}</button></div>`;
  }
  const q = curQ(l, E); if (!q) { xFinish(); return st5Summary(l, s); }
  return qForm(q, E, l.exam.indexOf(q), n);
}
function xPick(no, k){ const E = curE(); E.a[no] = k; if (UI.view !== 'rev') saveS();
  document.querySelectorAll(`[data-q="${no}"] .xo`).forEach(x => x.classList.toggle('on', x.dataset.l === k));
  const b = document.getElementById('xok'); if (b) b.disabled = false; }
function xGuess(no, v){ curE().g[no] = v; if (UI.view !== 'rev') saveS(); }
function xWhy(no, v){ curE().r[no] = v; if (UI.view !== 'rev') saveS(); }
function toggleMark(w){
  const box = w.closest('[data-q]'); if (!box) return; const no = box.dataset.q;
  const E = curE(); const key = lookup(w.textContent).key; const arr = E.m[no] || (E.m[no] = []);
  const i = arr.indexOf(key); if (i >= 0) arr.splice(i,1); else arr.push(key); if (UI.view !== 'rev') saveS(); restoreMarks();
}
function restoreMarks(){
  const E = curE(); if (!E) return;
  document.querySelectorAll('[data-q]').forEach(box => { const arr = E.m[box.dataset.q] || [];
    box.querySelectorAll('.w').forEach(w => w.classList.toggle('mk', arr.includes(lookup(w.textContent).key))); });
}
function xConfirm(no){
  const E = curE(); if (!E.a[no]) return;
  const q = QBANK()[no];
  E.t = E.t || {}; E.t[no] = (Date.now() - (UI.qStart || Date.now())) / 1000;
  E.done[no] = true;
  (E.m[no]||[]).forEach(k => addVocab(k, lookup(k).zh, `GAL課程 第${q.lid}課 NO.${no}`, q.stem));
  S.rev = S.rev || {};
  const solid = E.a[no] === q.ans && !E.g[no];
  if (solid) delete S.rev[no];
  else S.rev[no] = { lid: q.lid, at: Date.now(), miss: ((S.rev[no]||{}).miss || 0) + 1 };
  saveS(); UI.showNo = no; render(); window.scrollTo(0,0);
}
function xNext(){ const l = L(), E = LS(l.id).ex; UI.showNo = null; if (!curQ(l, E)) xFinish(); render(); window.scrollTo(0,0); }
function xFinish(){
  const l = L(), s = LS(l.id), E = s.ex; if (E.sub) return;
  let score = 0, guessed = 0;
  l.exam.forEach(q => { const ok = E.a[q.no] === q.ans; if (ok) score++; if (ok && E.g[q.no]) guessed++; });
  E.sub = true; s.score = score; s.green = (score === l.exam.length && guessed === 0); s.done[5] = true;
  s.hist = (s.hist||[]).concat({ at:new Date().toISOString(), score, guessed });
  saveS();
}
function qReview(q, E){
  const my = E.a[q.no], ok = my === q.ans, g = E.g[q.no], sec = E.t && E.t[q.no];
  const head = ok ? (g ? '🟡 答對了，但你勾了「猜的」→ 算<b>矇對</b>。換個問法可能就會錯，下面解析看仔細。' : '✅ 答對！')
                  : `❌ 你選 ${my||'（沒答）'}，正解是 <b>${q.ans}</b>。`;
  const inRev = S.rev && S.rev[q.no];
  const revLine = inRev ? '<br>📌 這題已放進 🔁 複習區，隔天再考一次。' : (UI.view === 'rev' ? '<br>🎓 這題從複習區畢業了！' : '');
  const timeLine = sec != null ? `<br>⏱️ 這題花了 ${fmtSec(sec)}${sec > 90 ? '（超過考場平均 1.5 分鐘——下次先找鑰匙字，不用每個字都讀懂）' : '（在考場節奏內 👍）'}` : '';
  return `<div class="fb ${ok ? (g ? 'mid' : 'ok') : 'bad'}">${head}<br>決勝片段：${q.keys.map(k => `<b class="key en-t">${esc(k)}</b>`).join('、')}${timeLine}${revLine}</div>
   <div class="xq" data-mode="learn">
    <div class="no">NO.${q.no}</div>
    <div class="stem en-t">${boldKeys(q.stem, q.keys)}</div>
    ${q.opts.map((o,k) => { const L_ = LET[k]; const c = L_===q.ans ? 'ok' : (L_===my ? 'bad' : '');
      return `<div class="xo ${c}" style="cursor:default"><span class="lt">${L_}.</span><div><span class="en-t">${boldKeys(o, q.keys)}</span><div class="why">${L_===q.ans?'✅ ':'✗ '}${q.why[L_]}</div></div></div>`; }).join('')}
    ${(E.m[q.no]||[]).length ? `<div class="tiny">你在這題標的生字（已進生字庫）：${E.m[q.no].map(k=>`<b>${esc(k)}</b> ${esc(lookup(k).zh||'（待補）')}`).join('、')}</div>` : ''}
    ${E.r[q.no] ? `<div class="tiny">你的理由：${esc(E.r[q.no])}</div>` : ''}
   </div>`;
}
function avgLine(qs, E){ const ts = qs.map(q => (E.t||{})[q.no]).filter(x => x != null); if (!ts.length) return '';
  const avg = ts.reduce((a,b)=>a+b,0) / ts.length; return `<p class="tiny">⏱️ 平均每題 ${fmtSec(avg)}（考場約 1.5 分鐘一題）</p>`; }
function st5Summary(l, s){
  const E = s.ex, n = l.exam.length;
  const guessedOk = l.exam.filter(q => E.a[q.no]===q.ans && E.g[q.no]).map(q=>q.no);
  return `<div class="box ${s.green?'key':'warn'}"><div class="res">${s.score} / ${n}</div>
    <p>${s.green ? '🎉 全對而且沒有用猜的——<b>第 '+l.id+' 課正式轉綠！</b>' :
      `還沒轉綠。錯的和猜的題已經放進首頁的 🔁 複習區。${guessedOk.length?'<br>⚠️ <b>矇對：NO.'+guessedOk.join('、NO.')+'</b>——答案對但你是猜的，不算會。':''}`}</p>
    ${avgLine(l.exam, E)}
    <div class="row"><button class="btn pri" onclick="copyText(resultText())">📋 複製結果給麥口</button><button class="btn" onclick="xRetry()">🔁 重考這課</button><button class="btn" onclick="goHome()">回課程列表</button></div>
   </div>
   ${l.exam.map(q => { const ok = E.a[q.no]===q.ans, g = E.g[q.no];
     return `<details ${ok&&!g?'':'open'}><summary>NO.${q.no} · ${ok ? (g?'🟡 矇對':'✅ 答對') : '❌ 答錯'}</summary>${qReview(q, E)}</details>`; }).join('')}`;
}
function qLine(q, E){
  const my = E.a[q.no]||'-', ok = my===q.ans;
  let t = `NO.${q.no} 答 ${my} ${ok?'✅':'❌ 正解 '+q.ans}`;
  if (E.g[q.no]) t += ' 🤔我是猜的';
  if (E.t && E.t[q.no] != null) t += ' ⏱️' + fmtSec(E.t[q.no]);
  if ((E.m[q.no]||[]).length) t += ' ｜生字 ' + E.m[q.no].map(k=>'['+k+']').join(' ');
  if (E.r[q.no]) t += ' ｜理由：' + E.r[q.no];
  return t;
}
function resultText(){
  const l = L(), s = LS(l.id), E = s.ex;
  return [`【GAL 第${l.id}課驗收】${s.score}/${l.exam.length}（${s.green?'轉綠':'未轉綠'}）`].concat(l.exam.map(q => qLine(q, E))).join('\n');
}
function xRetry(){ const s = LS(UI.id); s.ex = {a:{},g:{},m:{},r:{},t:{},done:{},sub:false}; saveS(); UI.showNo = null; UI.qNo = null; render(); window.scrollTo(0,0); }

/* 🔁 複習區：所有課答錯或矇對的題，答對（且沒勾猜的）才畢業 */
function revCount(){ return Object.keys(S.rev || {}).length; }
function openRev(){
  const nos = Object.keys(S.rev || {}).map(Number).sort((a,b) => S.rev[a].at - S.rev[b].at);
  if (!nos.length) return;
  UI.view = 'rev'; UI.rv = { queue: nos, a:{}, g:{}, m:{}, r:{}, t:{}, done:{} }; UI.showNo = null; UI.qNo = null;
  render(); window.scrollTo(0,0);
}
function renderRev(){
  const E = UI.rv, bank = QBANK(), n = E.queue.length;
  let body;
  if (UI.showNo) {
    const idx = E.queue.indexOf(UI.showNo), last = !E.queue.some(x => !E.done[x]);
    body = `${progress(idx+1, n)}<p class="tiny">第 ${idx+1} / ${n} 題 · 解析（來自第 ${bank[UI.showNo].lid} 課）</p>${qReview(bank[UI.showNo], E)}
      <div class="nav"><span></span><button class="btn pri" onclick="UI.showNo=null;render();window.scrollTo(0,0)">${last ? '看結果 →' : '下一題 →'}</button></div>`;
  } else {
    const no = E.queue.find(x => !E.done[x]);
    body = no === undefined ? rvSummary() : qForm(bank[no], E, E.queue.indexOf(no), n);
  }
  $app.innerHTML = `<header class="top"><div class="row"><button class="btn sm" onclick="goHome()">← 課程列表</button><b>🔁 複習區</b><span class="tiny">答錯或矇對過的題，再考一次</span></div></header>` + body;
  wrapWords($app); restoreMarks();
}
function rvSummary(){
  const E = UI.rv, n = E.queue.length, grad = E.queue.filter(no => !(S.rev || {})[no]).length;
  return `<div class="box ${grad===n?'key':'warn'}"><div class="res">${grad} / ${n} 題畢業</div>
    <p>${grad===n ? '🎉 複習區清空了！' : `還有 ${n-grad} 題留在複習區，明天再來。`}</p>${avgLine(E.queue.map(no => ({no})), E)}
    <div class="row"><button class="btn pri" onclick="copyText(rvText())">📋 複製結果給麥口</button><button class="btn" onclick="goHome()">回課程列表</button></div></div>`;
}
function rvText(){
  const E = UI.rv, bank = QBANK(), n = E.queue.length, grad = E.queue.filter(no => !(S.rev || {})[no]).length;
  return [`【GAL 複習區】畢業 ${grad}/${n}`].concat(E.queue.map(no => `（第${bank[no].lid}課）` + qLine(bank[no], E))).join('\n');
}

render();
</script>
